<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Origami Chat material workbench</title>
    <link rel="stylesheet" href="/tests/visual/chat/workbench/workbench.css" />
  </head>
  <body>
    <main class="workbench" data-workbench-ready="true">
      <header class="workbench__heading">
        <p>VibeSpace visual reconstruction · test-only</p>
        <h1>Origami Chat material workbench</h1>
        <p>100% source scale · labels remain outside every comparison specimen</p>
      </header>

      <section class="paper-stage" aria-label="Paper material samples">
        <figure>
          <figcaption>paper-base.webp · 320 × 112</figcaption>
          <div
            class="paper-base"
            data-asset="paper-base.webp"
            data-intended-width="320"
            data-intended-height="112"
            data-specimen="true"
            aria-label="Warm paper base"
          ></div>
        </figure>
        <figure>
          <figcaption>paper-grain.webp · 256 × 96</figcaption>
          <div
            class="paper-grain"
            data-asset="paper-grain.webp"
            data-intended-width="256"
            data-intended-height="96"
            data-specimen="true"
            aria-label="Fibrous paper grain"
          ></div>
        </figure>
      </section>

      <section class="wide-stage" aria-label="Wide segmented materials">
        <figure>
          <figcaption>top-ribbon.svg · 1140 × 88</figcaption>
          <img
            class="top-ribbon"
            data-asset="top-ribbon.svg"
            data-intended-width="1140"
            data-intended-height="88"
            data-specimen="true"
            src="/app/public/assets/origami-chat/top-ribbon.svg"
            alt="Layered origami top ribbon"
            width="1140"
            height="88"
          />
        </figure>
        <figure>
          <figcaption>bottom-mountains.svg · 1672 × 80</figcaption>
          <img
            class="bottom-mountains"
            data-asset="bottom-mountains.svg"
            data-intended-width="1672"
            data-intended-height="80"
            data-specimen="true"
            src="/app/public/assets/origami-chat/bottom-mountains.svg"
            alt="Faceted lower mountain border"
            width="1672"
            height="80"
          />
        </figure>
      </section>

      <section class="material-grid" aria-label="Nine-slice and decorative materials">
        <figure class="material-grid__wide">
          <figcaption>panel-9slice.webp · intended 720 × 196</figcaption>
          <div
            class="nine-slice panel-slice"
            data-asset="panel-9slice.webp"
            data-intended-width="720"
            data-intended-height="196"
            data-specimen="true"
            aria-label="General folded paper panel"
          ></div>
        </figure>

        <figure>
          <figcaption>sidebar-row-9slice.webp · intended 224 × 43</figcaption>
          <div
            class="nine-slice sidebar-slice"
            data-asset="sidebar-row-9slice.webp"
            data-intended-width="224"
            data-intended-height="43"
            data-specimen="true"
            aria-label="Neutral sidebar row"
          ></div>
        </figure>
        <figure>
          <figcaption>sidebar-active-row-9slice.webp · intended 224 × 43</figcaption>
          <div
            class="nine-slice sidebar-active-slice"
            data-asset="sidebar-active-row-9slice.webp"
            data-intended-width="224"
            data-intended-height="43"
            data-specimen="true"
            aria-label="Active sidebar row"
          ></div>
        </figure>
        <figure>
          <figcaption>jarvis-frame-9slice.webp · intended 435 × 116</figcaption>
          <div
            class="nine-slice jarvis-slice"
            data-asset="jarvis-frame-9slice.webp"
            data-intended-width="435"
            data-intended-height="116"
            data-specimen="true"
            aria-label="Jarvis module frame"
          ></div>
        </figure>

        <figure class="decoration decoration--crane">
          <figcaption>crane.webp · 90 × 84</figcaption>
          <img
            data-asset="crane.webp"
            data-intended-width="90"
            data-intended-height="84"
            data-specimen="true"
            src="/app/public/assets/origami-chat/crane.webp"
            alt="Purple folded paper crane"
            width="90"
            height="84"
          />
        </figure>
        <figure class="decoration decoration--foliage">
          <figcaption>left-foliage.webp · 116 × 715</figcaption>
          <img
            data-asset="left-foliage.webp"
            data-intended-width="116"
            data-intended-height="715"
            data-specimen="true"
            src="/app/public/assets/origami-chat/left-foliage.webp"
            alt="Layered left-edge origami foliage"
            width="116"
            height="715"
          />
        </figure>
        <figure class="decoration decoration--flower">
          <figcaption>right-flower.webp · 298 × 271</figcaption>
          <img
            data-asset="right-flower.webp"
            data-intended-width="298"
            data-intended-height="271"
            data-specimen="true"
            src="/app/public/assets/origami-chat/right-flower.webp"
            alt="Layered lower-right origami flower"
            width="298"
            height="271"
          />
        </figure>
      </section>
    </main>
  </body>
</html>
