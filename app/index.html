<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/vibespace-icon.png" />
    <link rel="apple-touch-icon" href="/vibespace-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>VibeSpace</title>
    <!-- Fonts are self-hosted via @fontsource imports in src/main.tsx; the
         remote Google Fonts stylesheet was blocked by the production CSP. -->
    <!-- Pet overlay: mark transparent shell before any CSS/JS paint to avoid a black flash. -->
    <script>
      (function () {
        try {
          var view = new URLSearchParams(window.location.search).get('view');
          if (view === 'pet-overlay') {
            document.documentElement.dataset.vibespaceView = 'pet-overlay';
            document.documentElement.style.background = 'transparent';
            document.documentElement.style.backgroundColor = 'transparent';
            document.documentElement.style.backgroundImage = 'none';
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      html[data-vibespace-view='pet-overlay'],
      html[data-vibespace-view='pet-overlay'] body,
      html[data-vibespace-view='pet-overlay'] #root {
        background: transparent !important;
        background-color: transparent !important;
        background-image: none !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
