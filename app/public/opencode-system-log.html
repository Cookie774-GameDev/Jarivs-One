<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeSpace · OpenCode System Log</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #44352d;
        background: #f4e9d8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 4%, rgba(255, 255, 255, 0.88), transparent 34%),
          radial-gradient(circle at 92% 96%, rgba(197, 138, 91, 0.18), transparent 36%),
          linear-gradient(145deg, #fbf3e7, #f1e1cb);
      }
      main {
        width: min(900px, calc(100% - 36px));
        margin: 0 auto;
        padding: 36px 0 64px;
      }
      header {
        position: sticky;
        top: 16px;
        z-index: 2;
        padding: 22px 24px;
        margin-bottom: 18px;
        border: 1px solid rgba(132, 91, 61, 0.2);
        border-radius: 22px;
        background: rgba(255, 248, 237, 0.78);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 45px rgba(95, 61, 38, 0.09);
      }
      .eyebrow {
        color: #b45f3f;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 7px 0 4px;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.08;
      }
      header p {
        margin: 0;
        max-width: 690px;
        color: #766157;
        line-height: 1.55;
      }
      .statusbar {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        align-items: center;
        margin-top: 16px;
      }
      .pill {
        padding: 7px 11px;
        border-radius: 999px;
        background: rgba(124, 154, 110, 0.13);
        color: #526d47;
        font-size: 12px;
        font-weight: 700;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 8px 13px;
        cursor: pointer;
        color: #735546;
        background: rgba(185, 113, 75, 0.12);
        font-weight: 700;
      }
      #timeline {
        display: grid;
        gap: 12px;
      }
      .step {
        display: grid;
        grid-template-columns: 42px 1fr auto;
        gap: 14px;
        padding: 17px 18px;
        border: 1px solid rgba(132, 91, 61, 0.16);
        border-radius: 18px;
        background: rgba(255, 249, 239, 0.68);
        backdrop-filter: blur(14px);
        box-shadow: 0 8px 24px rgba(91, 58, 36, 0.055);
      }
      .icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: rgba(190, 111, 71, 0.12);
        font-size: 19px;
      }
      .step[data-kind='context'] .icon,
      .step[data-kind='siyuan'] .icon {
        background: rgba(113, 148, 98, 0.14);
      }
      .step[data-status='error'] {
        border-color: rgba(170, 62, 45, 0.34);
      }
      .step h2 {
        margin: 1px 0 4px;
        font-size: 15px;
      }
      .step p {
        margin: 0;
        color: #78645a;
        font-size: 13px;
        line-height: 1.45;
      }
      .when {
        color: #957b6d;
        font:
          11px/1.4 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        white-space: nowrap;
        text-align: right;
      }
      .duration {
        display: block;
        margin-top: 4px;
        color: #b15f42;
        font-weight: 700;
      }
      .empty {
        padding: 54px 24px;
        text-align: center;
        border: 1px dashed rgba(132, 91, 61, 0.25);
        border-radius: 20px;
        color: #806d62;
        background: rgba(255, 249, 239, 0.4);
      }
      .empty strong {
        display: block;
        margin-bottom: 7px;
        color: #4e3c33;
        font-family: Fraunces, Georgia, serif;
        font-size: 20px;
      }
      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 900px);
          padding-top: 10px;
        }
        header {
          top: 8px;
        }
        .step {
          grid-template-columns: 38px 1fr;
        }
        .when {
          grid-column: 2;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">Plain-language live trace</div>
        <h1>OpenCode system log</h1>
        <p>
          Only the important OpenCode, RLM, and SiYuan steps. Private prompts and noisy background
          checks stay out of this view.
        </p>
        <div class="statusbar">
          <span class="pill" id="status">Waiting for activity</span
          ><button id="clear" type="button">Clear this view</button>
        </div>
      </header>
      <section id="timeline" aria-live="polite"></section>
    </main>
    <script>
      const KEY = 'vibespace.opencode-system-log.v1';
      const icons = { request: '↗', context: '⌁', siyuan: '◎', model: '✦', warning: '!' };
      const formatDuration = (ms) =>
        ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)} s`;
      const formatTime = (ts) =>
        new Intl.DateTimeFormat(undefined, {
          hour: 'numeric',
          minute: '2-digit',
          second: '2-digit',
        }).format(new Date(ts));
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char],
        );
      function read() {
        try {
          return JSON.parse(localStorage.getItem(KEY) || '{"steps":[]}');
        } catch {
          return { steps: [] };
        }
      }
      function render() {
        const payload = read();
        const steps = Array.isArray(payload.steps) ? payload.steps : [];
        document.getElementById('status').textContent = steps.length
          ? `${steps.length} meaningful steps · live`
          : 'Waiting for activity';
        document.getElementById('timeline').innerHTML = steps.length
          ? [...steps]
              .reverse()
              .map(
                (item) => `
          <article class="step" data-kind="${esc(item.kind)}" data-status="${esc(item.status)}">
            <div class="icon" aria-hidden="true">${icons[item.kind] || '·'}</div>
            <div><h2>${esc(item.title)}${item.repeatCount > 1 ? ` <small>×${item.repeatCount}</small>` : ''}</h2><p>${esc(item.summary)}</p></div>
            <div class="when">${formatTime(item.ts)}${typeof item.durationMs === 'number' ? `<span class="duration">${formatDuration(item.durationMs)}</span>` : ''}</div>
          </article>`,
              )
              .join('')
          : '<div class="empty"><strong>No OpenCode activity yet</strong>Send a message or open a SiYuan Context Map. The important steps will appear here automatically.</div>';
      }
      document.getElementById('clear').addEventListener('click', () => {
        localStorage.removeItem(KEY);
        render();
      });
      window.addEventListener('storage', (event) => {
        if (event.key === KEY) render();
      });
      setInterval(render, 1000);
      render();
    </script>
  </body>
</html>
