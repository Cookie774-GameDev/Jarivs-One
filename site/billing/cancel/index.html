<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Checkout cancelled — VibeSpace</title>
  <link rel="icon" href="../../images/vibespace-logo.png" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2E2823;color:#F2EBE0;
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;text-align:center;padding:24px}
    .card{max-width:460px;background:#3A342F;border:1px solid #4D4742;border-radius:18px;padding:36px;
      box-shadow:0 24px 80px rgba(0,0,0,.4)}
    img{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
    h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:28px;margin:0 0 10px;color:#F0CC88}
    p{color:#C9BFB1;line-height:1.6;margin:8px 0}
    .hint{font-size:13px;color:#9A9085;margin-top:18px}
    a{color:#E0925C}
  </style>
</head>
<body>
  <main class="card">
    <img src="../../images/vibespace-logo.png" alt="VibeSpace" />
    <h1>Checkout cancelled</h1>
    <p>No charge was made. Your plan is unchanged — you can keep using VibeSpace
       free with your own keys and unlimited local Kokoro voice.</p>
    <p class="hint">Changed your mind? Reopen Settings → Plans in the app any time,
       or see <a href="https://vibespaceos.com/#pricing">pricing</a>.</p>
  </main>
</body>
</html>
