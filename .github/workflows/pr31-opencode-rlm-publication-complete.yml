name: PR31 OpenCode RLM publication complete

on:
  push:
    branches:
      - agent/pr31-opencode-rlm-verify-a6f1
    paths:
      - .github/workflows/pr31-opencode-rlm-publication-complete.yml

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr31-opencode-rlm-publication-complete
  cancel-in-progress: false

env:
  BASE_SHA: 4209030eb041c661ee1a4b55e87367136638762b
  STAGING_SHA: e0c11422a5d038231cdfa73bf3f48dffc7554f51
  TARGET_BRANCH: agent/pr30-fixes-and-updates
  PR_NUMBER: '31'
  PRIOR_RUN_ID: '31904067390'

jobs:
  complete-publication:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact published integration
        uses: actions/checkout@v5
        with:
          ref: ${{ env.STAGING_SHA }}
          fetch-depth: 0

      - name: Download definitive completed evidence
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRIOR_RUN_ID }}
          name: pr31-opencode-rlm-definitive-publication-proof
          path: ${{ runner.temp }}/prior

      - name: Validate all completed gates and corrected native blocker proof
        shell: bash
        run: |
          set -euo pipefail
          prior="$RUNNER_TEMP/prior"
          evidence="$RUNNER_TEMP/pr31-final-evidence"
          mkdir -p "$evidence"
          cp -a "$prior/." "$evidence/"

          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          grep -Fx 'NEW_FAILURE_IDENTITIES=0' "$prior/differential-summary.txt"
          grep -Fx 'FOCUSED_TESTS=214' "$prior/focused-summary.txt"
          grep -Fx 'FOCUSED_FAILED=0' "$prior/focused-summary.txt"
          grep -F 'PR31 OpenCode/RLM production wiring invariants: PASS' "$prior/production-wiring.log"
          grep -F 'built in' "$prior/build.log"
          grep -Fx 'SECRET_SCAN=PASS' "$prior/secret-scan.txt"
          grep -Fx 'NO_SILENT_FALLBACK=PASS' "$prior/secret-scan.txt"
          grep -Fx 'DIFF_CHECK=PASS' "$prior/diff-check.txt"
          grep -Fx 'FULL_CARGO_FMT=BASELINE_FAIL_IDENTICAL_UNCHANGED_FILE' "$prior/cargo-fmt-classification.txt"
          grep -Fx 'CHANGED_RUST_FILE_FMT=PASS' "$prior/rustfmt-changed-file-status.txt"
          grep -F 'Finished' "$prior/rust-check-and-test.log" | grep -F 'release'
          grep -Fx 'CHANGED_NATIVE_FILES=app/src-tauri/src/cli_bridge.rs' "$prior/changed-native-files.txt"
          grep -Fx 'BASE_FOCUSED_NATIVE_TEST_EXIT=101' "$prior/base-focused-native-test-status.txt"

          python - \
            "$prior/base-focused-native-test.log" \
            "$prior/rust-check-and-test.log" \
            "$evidence/native-linker-differential-corrected.txt" <<'PY'
          import pathlib
          import re
          import sys

          base_log, staged_log, output = sys.argv[1:]
          pattern = re.compile(r'undefined symbol: (__isoc23_(?:strtoull|strtoll|strtol))')
          base = sorted(set(pattern.findall(pathlib.Path(base_log).read_text(encoding='utf-8', errors='replace'))))
          staged = sorted(set(pattern.findall(pathlib.Path(staged_log).read_text(encoding='utf-8', errors='replace'))))
          expected = sorted({'__isoc23_strtol', '__isoc23_strtoll', '__isoc23_strtoull'})
          text = (
              f'BASE_UNDEFINED_SYMBOLS={",".join(base)}\n'
              f'STAGED_UNDEFINED_SYMBOLS={",".join(staged)}\n'
              f'IDENTICAL={"YES" if base == staged else "NO"}\n'
          )
          pathlib.Path(output).write_text(text, encoding='utf-8')
          print(text, end='')
          if base != staged or base != expected:
              raise SystemExit(1)
          PY

          echo 'FOCUSED_NATIVE_TEST=BLOCKED_ENVIRONMENT_IDENTICAL_ON_BASE' \
            | tee "$evidence/native-test-classification.txt"
          echo 'ALL_PRIOR_GATES_AND_NATIVE_BLOCKER_PROOF=PASS' \
            | tee "$evidence/prior-gates-validation.txt"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Typecheck all native test code without final link
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/pr31-final-evidence"
          cargo check --tests 2>&1 | tee "$evidence/cargo-check-tests.log"
          echo 'CARGO_CHECK_TESTS=PASS' | tee "$evidence/cargo-check-tests-status.txt"
          echo 'RUST_STATIC_GATES=PASS' | tee "$evidence/rust-static-status.txt"

      - name: Reconfirm target and push normally without force
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr31-final-evidence"
          git fetch --prune origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          before="$(git rev-parse "origin/${TARGET_BRANCH}")"
          printf 'REMOTE_TARGET_BEFORE_PUSH=%s\n' "$before" \
            | tee "$evidence/prepush-target.txt"
          test "$before" = "$STAGING_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            2>&1 | tee "$evidence/push.log"
          echo 'PUSH=PASS_NORMAL_NO_FORCE' | tee "$evidence/push-status.txt"

      - name: Prove SHA equality and PR state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr31-final-evidence"
          git fetch --prune origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse "origin/${TARGET_BRANCH}")"
          printf 'LOCAL_FINAL_SHA=%s\nREMOTE_PR31_SHA=%s\nSHA_MATCH=%s\n' \
            "$local_head" "$remote_head" \
            "$([ "$local_head" = "$remote_head" ] && echo YES || echo NO)" \
            | tee "$evidence/sha-proof.txt"
          test "$local_head" = "$remote_head"
          test "$remote_head" = "$STAGING_SHA"

          git log --format='%H %s' "$BASE_SHA..$STAGING_SHA" \
            | tee "$evidence/integration-commits.txt"
          git log -15 --oneline "origin/${TARGET_BRANCH}" \
            | tee "$evidence/remote-log.txt"
          git log --left-right --cherry-pick --oneline \
            "origin/${TARGET_BRANCH}...HEAD" > "$evidence/left-right.txt"
          test ! -s "$evidence/left-right.txt"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "$evidence/pr.json"
          python - "$local_head" "$TARGET_BRANCH" "$evidence/pr.json" "$evidence/pr-state.txt" <<'PY'
          import json
          import pathlib
          import sys

          expected_sha, expected_branch, input_path, output_path = sys.argv[1:]
          pr = json.loads(pathlib.Path(input_path).read_text(encoding='utf-8'))
          checks = {
              'PR_OPEN': pr.get('state') == 'open',
              'PR_DRAFT': pr.get('draft') is True,
              'PR_UNMERGED': pr.get('merged') is False,
              'HEAD_BRANCH': pr.get('head', {}).get('ref') == expected_branch,
              'HEAD_SHA': pr.get('head', {}).get('sha') == expected_sha,
          }
          text = ''.join(f'{name}={"PASS" if passed else "FAIL"}\n' for name, passed in checks.items())
          pathlib.Path(output_path).write_text(text, encoding='utf-8')
          print(text, end='')
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Create concrete final status evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr31-final-evidence"
          {
            cat "$evidence/sha-proof.txt"
            cat "$evidence/push-status.txt"
            cat "$evidence/pr-state.txt"
            cat "$evidence/focused-summary.txt"
            cat "$evidence/differential-summary.txt"
            echo 'TYPECHECK=PASS'
            echo 'BUILD=PASS'
            echo 'RELEASE_MANIFEST=PASS'
            echo 'RUST_CHECK_RELEASE=PASS'
            cat "$evidence/cargo-check-tests-status.txt"
            cat "$evidence/cargo-fmt-classification.txt"
            cat "$evidence/rustfmt-changed-file-status.txt"
            cat "$evidence/native-test-classification.txt"
            cat "$evidence/secret-scan.txt"
            cat "$evidence/diff-check.txt"
            echo 'PRODUCTION_WIRING=PASS'
            echo 'HISTORY_MODE=EXISTING_PUBLISHED_COMMITS_PRESERVED_NO_FORCE_REWRITE'
            echo 'NATIVE_LIVE_TESTS=IMPLEMENTED — NATIVE VERIFICATION REQUIRED'
          } | tee "$evidence/final-status.txt"

      - name: Upload final completed publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31-opencode-rlm-publication-complete-proof
          path: ${{ runner.temp }}/pr31-final-evidence
          if-no-files-found: warn
          retention-days: 14
