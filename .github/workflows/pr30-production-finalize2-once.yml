name: PR 30 corrected final production verification

on:
  push:
    branches:
      - codex/shared-intelligence-kernel-design-20260716
    paths:
      - .github/workflows/pr30-production-finalize2-once.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: pr30-production-finalize2-once
  cancel-in-progress: false

env:
  PR30_BRANCH: codex/shared-intelligence-kernel-design-20260716
  ORIGINAL_RUN_ID: "30727047782"
  PATCH_RUN_ID: "30727173937"
  RESULT_ARTIFACT: pr30-production-final2-result

jobs:
  prepare:
    name: Assemble corrected self-contained candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download original merged candidate
        uses: actions/download-artifact@v4
        with:
          name: pr30-production-result
          path: .original-candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}

      - name: Download assertion-patched candidate
        uses: actions/download-artifact@v4
        with:
          name: pr30-production-resume-result
          path: .patched-candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.PATCH_RUN_ID }}

      - name: Merge patched candidate and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH_SHA="$(git rev-parse HEAD)"

          source .original-candidate/pr30-production.env
          ORIGINAL_RESULT_SHA="$RESULT_SHA"
          INTEGRATED_MAIN_SHA="$MAIN_SHA"
          git fetch .original-candidate/pr30-production.bundle \
            refs/heads/pr30-production-result:refs/remotes/pr30-production/result
          test "$(git rev-parse refs/remotes/pr30-production/result)" = "$ORIGINAL_RESULT_SHA"

          source .patched-candidate/pr30-resume.env
          PATCHED_RESULT_SHA="$FINAL_SHA"
          PATCHED_BRANCH_PARENT_SHA="$CURRENT_SHA"
          git fetch .patched-candidate/pr30-resume.bundle \
            refs/heads/pr30-resume-result:refs/remotes/pr30-resume/result
          test "$(git rev-parse refs/remotes/pr30-resume/result)" = "$PATCHED_RESULT_SHA"

          git merge-base --is-ancestor "$ORIGINAL_RESULT_SHA" "$PATCHED_RESULT_SHA"
          git merge-base --is-ancestor "$INTEGRATED_MAIN_SHA" "$PATCHED_RESULT_SHA"
          git merge-base --is-ancestor "$PATCHED_BRANCH_PARENT_SHA" "$BRANCH_SHA"
          git merge --no-ff "$PATCHED_RESULT_SHA" \
            -m "Integrate the corrected PR 30 production candidate"

          for workflow in \
            .github/workflows/pr30-sync-main-once.yml \
            .github/workflows/pr30-vitest-diagnostic.yml \
            .github/workflows/pr30-production-fixes-once.yml \
            .github/workflows/pr30-production-resume-once.yml \
            .github/workflows/pr30-production-finalize-once.yml \
            .github/workflows/pr30-production-finalize2-once.yml; do
            if [ -f "$workflow" ]; then
              git rm "$workflow"
            fi
          done

          git commit -m "chore: remove one-time PR 30 verification helpers"

          FINAL_RESULT_SHA="$(git rev-parse HEAD)"
          printf 'BRANCH_SHA=%s\nORIGINAL_RESULT_SHA=%s\nINTEGRATED_MAIN_SHA=%s\nPATCHED_RESULT_SHA=%s\nFINAL_RESULT_SHA=%s\n' \
            "$BRANCH_SHA" "$ORIGINAL_RESULT_SHA" "$INTEGRATED_MAIN_SHA" \
            "$PATCHED_RESULT_SHA" "$FINAL_RESULT_SHA" > pr30-final2.env

          git branch -f pr30-final2-result "$FINAL_RESULT_SHA"
          git bundle create pr30-final2.bundle pr30-final2-result "^$BRANCH_SHA"
          git bundle verify pr30-final2.bundle

          git merge-base --is-ancestor "$BRANCH_SHA" "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$ORIGINAL_RESULT_SHA" "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$INTEGRATED_MAIN_SHA" "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$PATCHED_RESULT_SHA" "$FINAL_RESULT_SHA"
          git diff --check "$BRANCH_SHA..$FINAL_RESULT_SHA" -- . \
            ':(exclude)docs/ideas/TASKBAR_AI_USAGE_MODULE.md'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: |
            pr30-final2.bundle
            pr30-final2.env
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Verify TypeScript, build, Edge contracts, Vitest, and release manifest
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-final2

      - name: Check out exact corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-final2/pr30-final2.env
          test "$(git rev-parse HEAD)" = "$BRANCH_SHA"
          git fetch .pr30-final2/pr30-final2.bundle \
            refs/heads/pr30-final2-result:refs/remotes/pr30-final2/result
          test "$(git rev-parse refs/remotes/pr30-final2/result)" = "$FINAL_RESULT_SHA"
          git checkout --detach "$FINAL_RESULT_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Test Edge access and version contracts
        run: >-
          node --test
          supabase/functions/_shared/appVersion.test.ts
          supabase/functions/_shared/appAccessGate.test.ts
          supabase/functions/call-start/index.test.ts
          supabase/functions/tts-speak/index.test.ts

      - name: Test full frontend suite
        run: npm --prefix app run test

      - name: Test release manifest
        run: npm run test:release-manifest

  rust:
    name: Verify Rust release check
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-final2

      - name: Check out exact corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-final2/pr30-final2.env
          test "$(git rev-parse HEAD)" = "$BRANCH_SHA"
          git fetch .pr30-final2/pr30-final2.bundle \
            refs/heads/pr30-final2-result:refs/remotes/pr30-final2/result
          test "$(git rev-parse refs/remotes/pr30-final2/result)" = "$FINAL_RESULT_SHA"
          git checkout --detach "$FINAL_RESULT_SHA"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check --release
        working-directory: app/src-tauri
        run: cargo check --release

  publish:
    name: Publish corrected verified candidate to PR 30
    needs: [prepare, frontend, rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-final2

      - name: Verify branch stability and fast-forward
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-final2/pr30-final2.env

          CURRENT_REMOTE_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_REMOTE_SHA" != "$BRANCH_SHA" ]; then
            echo "PR branch moved during verification; refusing to overwrite it."
            echo "Expected: $BRANCH_SHA"
            echo "Current:  $CURRENT_REMOTE_SHA"
            exit 1
          fi

          git fetch .pr30-final2/pr30-final2.bundle \
            refs/heads/pr30-final2-result:refs/remotes/pr30-final2/result
          test "$(git rev-parse refs/remotes/pr30-final2/result)" = "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$BRANCH_SHA" "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$ORIGINAL_RESULT_SHA" "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$INTEGRATED_MAIN_SHA" "$FINAL_RESULT_SHA"
          git merge-base --is-ancestor "$PATCHED_RESULT_SHA" "$FINAL_RESULT_SHA"

          for workflow in \
            .github/workflows/pr30-sync-main-once.yml \
            .github/workflows/pr30-vitest-diagnostic.yml \
            .github/workflows/pr30-production-fixes-once.yml \
            .github/workflows/pr30-production-resume-once.yml \
            .github/workflows/pr30-production-finalize-once.yml \
            .github/workflows/pr30-production-finalize2-once.yml; do
            if git ls-tree -r --name-only "$FINAL_RESULT_SHA" | grep -qx "$workflow"; then
              echo "Temporary workflow remains in final tree: $workflow"
              exit 1
            fi
          done

          git push origin "$FINAL_RESULT_SHA:refs/heads/$PR30_BRANCH"
