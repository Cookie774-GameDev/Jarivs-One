name: PR 30 merged-state Vitest diagnostic

on:
  push:
    branches:
      - codex/shared-intelligence-kernel-design-20260716
    paths:
      - .github/workflows/pr30-vitest-diagnostic.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr30-vitest-diagnostic
  cancel-in-progress: true

jobs:
  vitest-diagnostic:
    name: Capture exact merged-state Vitest failure
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/shared-intelligence-kernel-design-20260716
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the conflict-resolved merge state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --force
          git merge --no-ff -X ours origin/main \
            -m "Diagnostic merge of main into PR #30"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Vitest and capture complete output
        id: vitest
        continue-on-error: true
        env:
          NO_COLOR: "1"
        shell: bash
        run: |
          set -o pipefail
          npm --prefix app run test -- --reporter=verbose 2>&1 | tee pr30-vitest-output.txt

      - name: Upload Vitest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr30-vitest-diagnostic
          path: pr30-vitest-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Post compact failure details to PR 30
        if: steps.vitest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- pr30-vitest-diagnostic -->'
            echo '### PR #30 merged-state Vitest diagnostic'
            echo
            echo 'The exact conflict-resolved merge state failed Vitest. The final 220 output lines are below.'
            echo
            echo '```text'
            tail -n 220 pr30-vitest-output.txt
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > pr30-vitest-comment.md
          gh pr comment 30 --repo "$GITHUB_REPOSITORY" --body-file pr30-vitest-comment.md

      - name: Preserve failing status
        if: steps.vitest.outcome == 'failure'
        run: exit 1
