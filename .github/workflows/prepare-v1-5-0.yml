name: Prepare VibeSpace v1.5.0

on:
  push:
    branches:
      - rescue/grok-workbench-20260715

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rescue/grok-workbench-20260715
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Synchronize v1.5.0 metadata and release automation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const VERSION = '1.5.0';
          const OLD = '0.1.48';

          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, s) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, s.replace(/\r\n/g, '\n'));
          };
          const updateJson = (p, mutate) => {
            const obj = JSON.parse(read(p));
            mutate(obj);
            write(p, JSON.stringify(obj, null, 2) + '\n');
          };

          updateJson('package.json', (x) => { x.version = VERSION; });
          updateJson('app/package.json', (x) => { x.version = VERSION; });
          updateJson('package-lock.json', (x) => {
            x.version = VERSION;
            if (x.packages?.['']) x.packages[''].version = VERSION;
            if (x.packages?.app) x.packages.app.version = VERSION;
          });
          updateJson('app/src-tauri/tauri.conf.json', (x) => { x.version = VERSION; });

          let cargo = read('app/src-tauri/Cargo.toml');
          cargo = cargo.replace(/(\[package\][\s\S]*?\nversion\s*=\s*")[^"]+("\s*\n)/, `$1${VERSION}$2`);
          write('app/src-tauri/Cargo.toml', cargo);

          let boot = read('scripts/boot-validation.mjs');
          boot = boot.replace(`const CURRENT_VERSION = '${OLD}';`, `const CURRENT_VERSION = '${VERSION}';`);
          write('scripts/boot-validation.mjs', boot);

          let releases = read('app/src/features/whats-new/releases.ts');
          releases = releases.replace(`export const CURRENT_VERSION = '${OLD}';`, `export const CURRENT_VERSION = '${VERSION}';`);
          if (!releases.includes("version: '1.5.0'")) {
            const entry = `  {\n    version: '1.5.0',\n    date: '2026-07-15',\n    headline: 'Complete VibeSpace Workbench and agent platform',\n    summary:\n      'This major release combines terminal recovery, Pixel Pets, the full spatial Workbench, private Jarvis memory and task execution, subscription-aware CLI providers, the VibeSpace theme system, and the rescued Grok Browser, Preview Studio, editor, files, notes, Jarvis panels, wallpapers, and native desktop integrations.',\n    sections: [\n      {\n        kind: 'feature',\n        items: [\n          'Spatial Workbench with draggable and resizable panels, saved layouts, templates, detached windows, persistence, browser, editor, files, notes, Jarvis, terminal, device preview, and embedded surfaces.',\n          'Vibe Browser and Preview Studio with isolated browser profiles, local-server discovery, responsive device frames, navigation controls, and native Tauri surfaces.',\n          'Pixel Pets with transparent desktop overlay, AXO and GLITCH skins, shared chat and terminal surfaces, mini-panel controls, and persisted motion preferences.',\n          'Jarvis task execution with durable runs, approvals, cancellation, recovery, MCP and plugin lifecycle management, private learning, and account-scoped All About Me files.',\n          'Subscription-aware AI connections and native CLI bridge for Codex, Claude, Gemini, Copilot, Qwen, OpenCode, local models, and exact per-chat routing.',\n          'Wallpaper library with previews, local blob storage, entitlements, Orbit redemption, native master caching, Supabase functions, and bundled animated wallpapers.',\n        ],\n      },\n      {\n        kind: 'improvement',\n        items: [\n          'Terminal snapshots, layouts, drafts, and safe-shell sessions recover across restarts with bounded storage and secret redaction.',\n          'Four synchronized appearance themes now work across the main app, detached Workbench, pet windows, and settings.',\n          'Command palette and assistant actions open and configure Workbench, Browser, Preview Studio, agents, files, terminals, and project tools consistently.',\n          'Files, chat activity, usage cards, provider selection, model routing, scheduled actions, and agent coordination include the accumulated improvements from PRs #18 through #23.',\n        ],\n      },\n      {\n        kind: 'fix',\n        items: [\n          'Resolved the Workbench integration overlaps without deleting the validated installer or dropping terminal, pet, theme, provider, subscription, or Jarvis functionality.',\n          'Fixed wallpaper IndexedDB blob type safety and preserved local object URL rehydration.',\n          'Kept all original Grok Workbench source in a permanent backup branch while publishing the reviewed combined repository state.',\n        ],\n      },\n      {\n        kind: 'shipped',\n        items: [\n          'Version synchronized to 1.5.0 across npm, package lock, Tauri, Cargo, boot validation, and in-app release metadata.',\n          'Cross-platform GitHub release builds Windows, macOS, and Linux installers and generates signed updater artifacts when the configured updater key is available.',\n        ],\n      },\n    ],\n  },\n`;
            releases = releases.replace('export const RELEASES: readonly Release[] = [\n', 'export const RELEASES: readonly Release[] = [\n' + entry);
          }
          write('app/src/features/whats-new/releases.ts', releases);

          let about = read('app/src/features/settings/sections/About.tsx');
          if (!about.includes('v1.5.0 (Latest)')) {
            const anchor = '        <div className="flex flex-col gap-5 border-l border-border pl-4 relative">\n';
            const card = `          <div className="relative">\n            <div className="absolute -left-[21.5px] top-1.5 h-2.5 w-2.5 rounded-full border-2 border-accent-copper bg-panel" />\n            <div className="flex items-center justify-between gap-2">\n              <span className="font-semibold text-foreground text-secondary">v1.5.0 (Latest)</span>\n              <span className="text-metadata text-muted-foreground font-mono">July 15, 2026</span>\n            </div>\n            <p className="text-secondary text-muted-foreground mt-1 leading-relaxed">\n              Complete VibeSpace integration: terminal recovery, Pixel Pets, spatial Workbench, Jarvis execution and private memory, CLI providers, synchronized themes, Browser, Preview Studio, editor, files, notes, wallpapers, and native desktop tooling.\n            </p>\n          </div>\n\n`;
            about = about.replace(anchor, anchor + card).replace('v0.1.31 (Latest)', 'v0.1.31');
          }
          write('app/src/features/settings/sections/About.tsx', about);

          for (const p of ['README.md', 'DOWNLOAD.md', 'app/src/features/onboarding/steps/Welcome.tsx', 'tools/terminal_boot/jarvis_boot_forever.py']) {
            if (!fs.existsSync(p)) continue;
            write(p, read(p).replaceAll('0.1.48', VERSION).replaceAll('v0.1.48', `v${VERSION}`));
          }

          const changelogPath = 'CHANGELOG.md';
          let changelog = read(changelogPath);
          if (!changelog.includes('## [1.5.0]')) {
            const section = `## [1.5.0] - 2026-07-15\n\n### Added\n- Complete spatial Workbench with Browser, Preview Studio, editor, files, notes, Jarvis, terminal, device preview, templates, wallpapers, and persistent layouts.\n- Pixel Pets, durable Jarvis task execution and private memory, subscription-aware CLI providers, synchronized themes, and wallpaper entitlements.\n\n### Changed\n- Integrated all validated work from PRs #18 through #23 with the rescued Grok Workbench while preserving the existing installer and application functions.\n- Promoted the combined integration to the official v1.5.0 release line.\n\n### Fixed\n- Resolved integration overlaps across Tauri capabilities, Rust command registration, command-palette actions, terminal recovery, themes, pets, providers, and Workbench routing.\n\n`;
            const headingEnd = changelog.indexOf('\n', changelog.indexOf('#')) + 1;
            changelog = changelog.slice(0, headingEnd) + '\n' + section + changelog.slice(headingEnd);
          }
          write(changelogPath, changelog);

          write('releases/RELEASE_NOTES_1.5.0.md', `# VibeSpace 1.5.0\n\nReleased July 15, 2026.\n\n## Highlights\n\n- Complete spatial Workbench with draggable/resizable panels, templates, persistence, detached windows, terminal, Browser, Preview Studio, editor, files, notes, Jarvis, device previews, and wallpapers.\n- Pixel Pets with transparent overlay, AXO/GLITCH animations, shared chat and terminal surfaces, and account controls.\n- Durable Jarvis task runs, approvals, recovery, private learning, All About Me persistence, MCP/plugin lifecycle, and gold-standard intent handling.\n- Subscription-aware provider registry and native CLI bridge for Codex, Claude, Gemini, Copilot, Qwen, OpenCode, and local models.\n- VibeSpace, Jarvis Core, Default, and Light themes synchronized across every app window.\n- Terminal presentation recovery, bounded snapshots, safe-shell restart rules, secret redaction, and update-safe persistence.\n- Wallpaper library, bundled animated wallpapers, Orbit redemption, Supabase catalog/download functions, and native master caching.\n\n## Integration guarantee\n\nThis release is based on PR #26 and contains the validated work from PRs #18 through #23 plus the rescued Grok Workbench. The existing installer, terminal, pet, theme, subscription, provider, Jarvis, and update functions are preserved.\n\n## Install\n\nWindows:\n\n\`\`\`powershell\nirm https://raw.githubusercontent.com/Cookie774-GameDev/VibeSpace/main/install/install.ps1 | iex\n\`\`\`\n\nmacOS/Linux:\n\n\`\`\`bash\ncurl -fsSL https://raw.githubusercontent.com/Cookie774-GameDev/VibeSpace/main/install/install.sh | bash\n\`\`\`\n`);

          let releaseWorkflow = read('.github/workflows/release.yml');
          releaseWorkflow = releaseWorkflow.replace("node -e \"require('fs').writeFileSync('app/src-tauri/tauri.release.generated.json', JSON.stringify({ bundle: { createUpdaterArtifacts: false } }))\"", "node -e \"require('fs').writeFileSync('app/src-tauri/tauri.release.generated.json', JSON.stringify({ bundle: { createUpdaterArtifacts: true } }))\"");
          if (!releaseWorkflow.includes('TAURI_SIGNING_PRIVATE_KEY:')) {
            const dollar = '$';
            const secretKey = dollar + '{{ secrets.TAURI_SIGNING_PRIVATE_KEY }}';
            const secretPassword = dollar + '{{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}';
            releaseWorkflow = releaseWorkflow.replace(
              '          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n',
              `          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          TAURI_SIGNING_PRIVATE_KEY: ${secretKey}\n          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${secretPassword}\n`,
            );
          }
          write('.github/workflows/release.yml', releaseWorkflow);

          write('.github/workflows/tag-v1-5-0.yml', `name: Tag VibeSpace v1.5.0\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: write\n\njobs:\n  tag:\n    if: github.actor != 'github-actions[bot]'\n    runs-on: ubuntu-22.04\n    steps:\n      - uses: actions/checkout@v5\n        with:\n          ref: main\n          fetch-depth: 0\n      - name: Verify, remove one-use trigger, and tag\n        shell: bash\n        run: |\n          set -euo pipefail\n          test \"$(node -p \"require('./package.json').version\")\" = \"1.5.0\"\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n          git rm .github/workflows/tag-v1-5-0.yml\n          git commit -m \"Remove one-use v1.5.0 tag trigger\"\n          git push origin main\n          git tag -a v1.5.0 -m \"VibeSpace 1.5.0\"\n          git push origin v1.5.0\n`);

          const expr = '$' + '{{ github.event.workflow_run.conclusion == \'success\' && github.event.workflow_run.head_branch == \'v1.5.0\' }}';
          write('.github/workflows/publish-v1-5-0.yml', `name: Publish VibeSpace v1.5.0\n\non:\n  workflow_run:\n    workflows: [Release]\n    types: [completed]\n\npermissions:\n  contents: write\n\njobs:\n  publish:\n    if: ${expr}\n    runs-on: ubuntu-22.04\n    steps:\n      - name: Publish completed release\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: gh release edit v1.5.0 --repo \"$GITHUB_REPOSITORY\" --draft=false --latest\n`);

          fs.rmSync('.github/workflows/prepare-v1-5-0.yml');
          NODE

      - name: Validate version consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.5.0"
          test "$(node -p "require('./app/package.json').version")" = "1.5.0"
          test "$(node -p "require('./package-lock.json').version")" = "1.5.0"
          test "$(node -p "require('./app/src-tauri/tauri.conf.json').version")" = "1.5.0"
          grep -q '^version = "1.5.0"$' app/src-tauri/Cargo.toml
          grep -q "CURRENT_VERSION = '1.5.0'" app/src/features/whats-new/releases.ts
          grep -q "version: '1.5.0'" app/src/features/whats-new/releases.ts
          test -f releases/RELEASE_NOTES_1.5.0.md

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare VibeSpace v1.5.0"
          git push origin HEAD:rescue/grok-workbench-20260715
