name: Harvest PR31 finalization evidence

on:
  push:
    branches: [agent/pr31-opencode-rlm-verify-a6f1]
    paths: [.github/workflows/pr31-finalization-harvest.yml]

permissions:
  actions: read
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/pr31-opencode-rlm-verify-a6f1
          fetch-depth: 0

      - name: Wait for latest differential publication run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/pr31-opencode-rlm-promote-final.yml/runs?branch=agent%2Fpr31-opencode-rlm-verify-a6f1&event=push&per_page=10"
          run_id="$(gh api "$endpoint" --jq '.workflow_runs[0].id')"
          test -n "$run_id"
          echo "$run_id" > "$RUNNER_TEMP/run-id.txt"
          for _ in $(seq 1 180); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
            printf 'run_id=%s\nstatus=%s\nconclusion=%s\n' "$run_id" "$status" "$conclusion" | tee "$RUNNER_TEMP/live-status.txt"
            if [ "$status" = completed ]; then break; fi
            sleep 30
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')" = completed

      - name: Download artifact and job evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat "$RUNNER_TEMP/run-id.txt")"
          mkdir -p "$RUNNER_TEMP/harvest/artifact"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$RUNNER_TEMP/harvest/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$RUNNER_TEMP/harvest/jobs.json"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="pr31-opencode-rlm-differential-publication") | .id' | head -1)"
          if [ -n "$artifact_id" ]; then
            gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/harvest/artifact.zip"
            unzip -q "$RUNNER_TEMP/harvest/artifact.zip" -d "$RUNNER_TEMP/harvest/artifact"
          fi
          conclusion="$(jq -r '.conclusion // ""' "$RUNNER_TEMP/harvest/run.json")"
          head_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/harvest/run.json")"
          printf 'RUN_ID=%s\nRUN_CONCLUSION=%s\nWORKFLOW_HEAD_SHA=%s\n' "$run_id" "$conclusion" "$head_sha" > "$RUNNER_TEMP/harvest/harvest-status.txt"

      - name: Publish fixed-path evidence on verification branch
        shell: bash
        run: |
          set -euo pipefail
          dest='verification/pr31-opencode-rlm-final'
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/harvest/." "$dest/"
          git config user.name 'VibeSpace Integration Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest"
          git commit -m 'ci(pr31): publish finalization evidence' || true
          git push origin HEAD:agent/pr31-opencode-rlm-verify-a6f1
