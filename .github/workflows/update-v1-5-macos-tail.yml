name: Update VibeSpace v1.5.0 macOS final tail

on:
  create:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.ref_type == 'branch' && github.ref_name == 'update-v1.5.0-macos-tail'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Replace diagnostic comment with final log tails
        shell: bash
        run: |
          set -euo pipefail
          for job in 87524666509 87524666481; do
            gh api repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs > "$job.log"
            python - "$job" <<'PY'
          import re, sys
          from pathlib import Path
          job = sys.argv[1]
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = [ansi.sub('', line) for line in Path(f'{job}.log').read_text(errors='replace').splitlines()]
          cleaned = []
          for line in lines[-80:]:
              line = re.sub(r'^\d{4}-\d{2}-\d{2}T[^Z]+Z\s*', '', line)
              cleaned.append(line)
          Path(f'{job}.tail.txt').write_text('\n'.join(cleaned[-40:]))
          PY
          done
          {
            echo 'Final macOS release failure tails:'
            echo '```text'
            echo '--- macOS arm64 ---'
            cat 87524666509.tail.txt
            echo
            echo '--- macOS x64 ---'
            cat 87524666481.tail.txt
            echo '```'
          } > body.md
          jq -n --rawfile body body.md '{body:$body}' > payload.json
          gh api --method PATCH repos/$GITHUB_REPOSITORY/issues/comments/4987745757 --input payload.json
