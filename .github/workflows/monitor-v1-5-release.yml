name: Monitor official VibeSpace v1.5.0 release

on:
  create:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  monitor:
    if: github.ref_type == 'branch' && github.ref_name == 'monitor-v1.5.0'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_BRANCH: v1.5.0
      RELEASE_TAG: v1.5.0
      REPORT_PR: '27'
    steps:
      - name: Find or dispatch the Release workflow
        id: release
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$REPOSITORY" --workflow release.yml --branch "$RELEASE_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            gh workflow run release.yml --repo "$REPOSITORY" --ref "$RELEASE_BRANCH" -f tag="$RELEASE_TAG"
            for _ in $(seq 1 30); do
              sleep 5
              run_id="$(gh run list --repo "$REPOSITORY" --workflow release.yml --branch "$RELEASE_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [ -n "$run_id" ] && break
            done
          fi
          if [ -z "$run_id" ]; then
            gh pr comment "$REPORT_PR" --repo "$REPOSITORY" --body "v1.5.0 release monitor could not locate or dispatch the Release workflow."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Release run: https://github.com/$REPOSITORY/actions/runs/$run_id"

      - name: Wait for all cross-platform release jobs
        shell: bash
        run: |
          set +e
          gh run watch "${{ steps.release.outputs.run_id }}" --repo "$REPOSITORY" --exit-status
          status=$?
          conclusion="$(gh run view "${{ steps.release.outputs.run_id }}" --repo "$REPOSITORY" --json conclusion --jq '.conclusion')"
          url="https://github.com/$REPOSITORY/actions/runs/${{ steps.release.outputs.run_id }}"
          if [ "$status" -ne 0 ] || [ "$conclusion" != "success" ]; then
            gh pr comment "$REPORT_PR" --repo "$REPOSITORY" --body "Official v1.5.0 release build **failed**. Run: $url"
            exit 1
          fi
          gh pr comment "$REPORT_PR" --repo "$REPOSITORY" --body "Official v1.5.0 cross-platform release build passed. Verifying publication and required assets. Run: $url"

      - name: Wait for publication and verify required assets
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,assets >/tmp/release.json 2>/dev/null; then
              is_draft="$(jq -r '.isDraft' /tmp/release.json)"
              assets="$(jq -r '.assets[].name' /tmp/release.json)"
              if [ "$is_draft" = "false" ] \
                && grep -q '^latest.json$' <<< "$assets" \
                && grep -q '^SHA256SUMS.txt$' <<< "$assets" \
                && grep -q '\.sig$' <<< "$assets" \
                && grep -Eq '\.(exe|msi)$' <<< "$assets" \
                && grep -q '\.dmg$' <<< "$assets" \
                && grep -Eq '\.(AppImage|deb)$' <<< "$assets"; then
                release_url="https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
                gh pr comment "$REPORT_PR" --repo "$REPOSITORY" --body "✅ **VibeSpace v1.5.0 is officially published.** Signed updater artifacts, latest.json, SHA256SUMS.txt, Windows installers, macOS DMGs, and Linux packages are present. Release: $release_url"
                exit 0
              fi
            fi
            sleep 10
          done
          gh pr comment "$REPORT_PR" --repo "$REPOSITORY" --body "The v1.5.0 build passed, but final publication or required asset verification did not complete. The release remains safely unpublished/draft."
          exit 1
