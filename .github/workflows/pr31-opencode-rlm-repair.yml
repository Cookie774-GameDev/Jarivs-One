name: PR31 OpenCode RLM focused repair

on:
  push:
    branches:
      - agent/pr31-opencode-rlm-verify-a6f1
    paths:
      - .github/workflows/pr31-opencode-rlm-repair.yml
      - .integration/pr31-opencode-rlm/repair_focused_regressions.py
      - .integration/pr31-opencode-rlm/repair_model_order.py

permissions:
  contents: write

concurrency:
  group: pr31-opencode-rlm-focused-repair
  cancel-in-progress: true

env:
  STAGING_BRANCH: agent/pr31-opencode-rlm-staging-a6f1
  REPAIR_ASSET_REF: agent/pr31-opencode-rlm-verify-a6f1

jobs:
  repair-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout isolated staged integration
        uses: actions/checkout@v5
        with:
          ref: ${{ env.STAGING_BRANCH }}
          fetch-depth: 0

      - name: Checkout deterministic repair assets
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REPAIR_ASSET_REF }}
          path: .repair-assets
          sparse-checkout: |
            .integration/pr31-opencode-rlm/repair_focused_regressions.py
            .integration/pr31-opencode-rlm/repair_model_order.py
          sparse-checkout-cone-mode: false

      - name: Apply focused production repair
        shell: bash
        run: |
          set -euo pipefail
          python .repair-assets/.integration/pr31-opencode-rlm/repair_focused_regressions.py
          python .repair-assets/.integration/pr31-opencode-rlm/repair_model_order.py
          rm -rf .repair-assets
          git diff --check
          git diff --stat

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund

      - name: Run previously failing regressions
        working-directory: app
        run: >-
          npx --no-install vitest run
          src/lib/ai/useAccessibleChatModels.test.ts
          src/lib/ai/useAccessibleChatModels.smoke.test.ts
          src/lib/harness/__tests__/OpenCodeSessionPool.test.ts

      - name: Run complete focused integration set
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vitest run \
            src/lib/ai/useAccessibleChatModels.test.ts \
            src/lib/ai/useAccessibleChatModels.smoke.test.ts \
            src/lib/ai/modelSelection.test.ts \
            src/lib/ai/modelSelection.smoke.test.ts \
            src/lib/ai/adapters/opencode.test.ts \
            src/lib/ai/router.test.ts \
            src/lib/ai/router.connection.test.ts \
            src/lib/ai/router.smoke.test.ts \
            src/features/chat/runtime/__tests__/chatRuntimeCommandController.test.ts \
            src/features/chat/runtime/__tests__/runtimeModelControls.test.ts \
            src/features/chat/runtime/chatRuntimeSettingsStore.test.ts \
            src/features/chat/runtime/commandContracts.test.ts \
            src/features/chat/runtime/performanceProfile.test.ts \
            src/features/chat/runtime/rlmPreference.test.ts \
            src/features/chat/reasoningSlashStore.test.ts \
            src/features/context/rlm/__tests__/RlmCoordinator.test.ts \
            src/features/context/rlm/contextRlmProduction.test.ts \
            src/features/context/rlm/pointerAuthority.test.ts \
            src/features/context/rlm/routeDecision.test.ts \
            src/features/context/rlm/rlmOpenCodeTool.test.ts \
            src/lib/ai/catalog/canonicalModelCatalog.test.ts \
            src/lib/ai/catalog/modelVariants.test.ts \
            src/lib/harness/contracts.test.ts \
            src/lib/harness/__tests__/CredentialHydrationSnapshot.test.ts \
            src/lib/harness/__tests__/OpenCodeRequestControls.test.ts \
            src/lib/harness/__tests__/OpenCodeSdkSessionClient.test.ts \
            src/lib/harness/__tests__/OpenCodeSessionPool.test.ts \
            src/lib/harness/__tests__/OpenCodeTextAccumulator.test.ts \
            src/lib/harness/__tests__/OpenCodeTurnCoordinator.test.ts \
            src/lib/harness/__tests__/OpenCodeTurnGate.test.ts \
            src/lib/permissions/__tests__/OpenCodePermissionProfile.test.ts \
            src/lib/permissions/__tests__/RunScopedApprovalLease.test.ts \
            src/lib/mcp/builtins.test.ts \
            src/lib/mcp/registry.test.ts \
            src/lib/mcp/toolRouting.test.ts \
            src/lib/mcp/vibeSpaceGateway.test.ts \
            src/features/prompt-forge/modelSelection.test.ts \
            src/features/prompt-forge/promptForgeExecutor.test.ts \
            src/features/prompt-forge/preservation.test.ts \
            src/features/prompt-forge/sourcePack.test.ts \
            src/features/prompt-forge/contextPreparation.test.ts

      - name: Typecheck repaired tree
        run: npm run typecheck

      - name: Commit repaired staged tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VibeSpace Integration Agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/lib/ai/useAccessibleChatModels.ts \
            app/src/lib/ai/useAccessibleChatModels.test.ts \
            app/src/lib/harness/OpenCodeSessionPool.ts
          git commit -m "fix(opencode): preserve model routes and session continuity"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/${STAGING_BRANCH}"
