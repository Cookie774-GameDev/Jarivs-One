name: Diagnose VibeSpace v1.5.0 macOS failure

on:
  create:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.ref_type == 'branch' && github.ref_name == 'diagnose-v1.5.0-macos'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Extract failed macOS job tail
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/jobs/87524666509/logs > job.log
          tail -n 180 job.log > tail.log
          {
            echo 'Apple Silicon release failure tail:'
            echo '```text'
            cat tail.log
            echo '```'
          } > comment.md
          gh pr comment 27 --repo "$GITHUB_REPOSITORY" --body-file comment.md
