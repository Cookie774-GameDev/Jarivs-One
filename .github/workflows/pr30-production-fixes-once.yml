name: PR 30 production fixes and verified main sync

on:
  push:
    branches:
      - codex/shared-intelligence-kernel-design-20260716
    paths:
      - .github/workflows/pr30-production-fixes-once.yml

permissions:
  contents: read

concurrency:
  group: pr30-production-fixes-once
  cancel-in-progress: false

env:
  PR30_BRANCH: codex/shared-intelligence-kernel-design-20260716
  RESULT_ARTIFACT: pr30-production-result

jobs:
  prepare:
    name: Prepare latest-main merge and production fixes
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge latest main, preserve the five-theme contract, and fix P1 findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          START_SHA="$(git rev-parse HEAD)"
          git fetch origin main --force
          MAIN_SHA="$(git rev-parse origin/main)"
          MERGE_BASE_SHA="$(git merge-base "$START_SHA" "$MAIN_SHA")"

          # PR #30 owns intentional conflict hunks. Non-conflicting main work is
          # merged normally, then the seven canonical five-theme files are
          # restored explicitly so main's temporary two-theme contract cannot
          # create source/test drift in the integrated tree.
          git merge --no-ff -X ours "$MAIN_SHA" \
            -m "Merge latest main into PR #30 before production release"

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git checkout "$START_SHA" -- \
            app/src/features/appearance/themeSync.test.ts \
            app/src/features/appearance/themeSync.ts \
            app/src/features/appearance/themes.test.ts \
            app/src/features/appearance/themes.ts \
            app/src/features/settings/sections/Appearance.test.tsx \
            app/src/features/settings/sections/Appearance.tsx \
            app/src/stores/ui.test.ts

          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              write(path, text.replace(old, new, 1))

          # -----------------------------------------------------------------
          # P1: expose cloud authentication before the production Access gate.
          # -----------------------------------------------------------------
          access_path = "app/src/features/access/AccessAppHost.tsx"
          replace_once(
              access_path,
              "import * as React from 'react';\nimport { Button } from '@/components/ui/button';\nimport { getSupabaseClient, type TypedSupabaseClient } from '@/lib/supabase/client';\n",
              "import * as React from 'react';\nimport type { Session } from '@supabase/supabase-js';\nimport { Button } from '@/components/ui/button';\nimport { SignInDialog } from '@/features/auth/SignInDialog';\nimport { getSupabaseClient, type TypedSupabaseClient } from '@/lib/supabase/client';\n",
          )

          old_host = """export function InstalledAccessAppHost({ children }: { children: React.ReactNode }) {
            const featureTier = useAuthStore((state) => state.plan);
            const environment = import.meta.env as AccessBuildEnvironment;
            const appVersion = environment.VITE_APP_VERSION?.trim() || '0.0.0';
            const publicKeyConfiguration = environment.VITE_ACCESS_LEASE_PUBLIC_KEYS;
            const runtime = React.useMemo(
              () => createInstalledRuntime(featureTier, appVersion, publicKeyConfiguration),
              [appVersion, featureTier, publicKeyConfiguration],
            );

            return (
              <AccessAppHost
                enabled={isAccessGateEnabled(environment)}
                runtime={runtime}
                privacyUrl={safeHttpsUrl(environment.VITE_PRIVACY_URL)}
                termsUrl={safeHttpsUrl(environment.VITE_TERMS_URL)}
              >
                {children}
              </AccessAppHost>
            );
          }
          """
          new_host = """function publishInstalledCloudSession(session: Session | null): boolean {
            const userId = session?.user.id?.trim() ?? '';
            const previousUserId = useAuthStore.getState().cloudSession?.user_id.trim() ?? '';
            if (!userId) {
              useAuthStore.setState({ cloudSession: null, plan: 'free' });
              return false;
            }
            useAuthStore.setState({
              cloudSession: {
                user_id: userId,
                email: session?.user.email ?? '',
                expires_at: session?.expires_at ?? 0,
              },
              ...(previousUserId && previousUserId !== userId ? { plan: 'free' as const } : {}),
            });
            return true;
          }

          function InstalledCloudAuthentication({
            configured,
            onSignIn,
            onCreateAccount,
          }: {
            configured: boolean;
            onSignIn: () => void;
            onCreateAccount: () => void;
          }) {
            return (
              <main className="flex min-h-screen items-center justify-center bg-background px-6 py-12">
                <section className="w-full max-w-md rounded-3xl border border-border/80 bg-elevated p-7 shadow-2xl">
                  <p className="text-xs font-semibold uppercase tracking-[0.18em] text-accent-copper">
                    VibeSpace Access
                  </p>
                  <h1 className="mt-3 text-2xl font-semibold text-foreground">Sign in to VibeSpace</h1>
                  <p className="mt-2 text-sm leading-relaxed text-muted-foreground">
                    Sign in or create an account before VibeSpace verifies your trial or subscription.
                  </p>
                  {!configured ? (
                    <p
                      className="mt-4 rounded-xl border border-amber-500/40 bg-amber-500/10 px-3 py-2.5 text-sm text-amber-100"
                      role="alert"
                    >
                      Cloud authentication is not configured in this build. Install the official release
                      or contact VibeSpace support.
                    </p>
                  ) : null}
                  <div className="mt-6 grid gap-3 sm:grid-cols-2">
                    <Button type="button" onClick={onSignIn}>
                      Sign in
                    </Button>
                    <Button type="button" variant="outline" onClick={onCreateAccount}>
                      Create account
                    </Button>
                  </div>
                </section>
              </main>
            );
          }

          export function InstalledAccessAppHost({ children }: { children: React.ReactNode }) {
            const featureTier = useAuthStore((state) => state.plan);
            const environment = import.meta.env as AccessBuildEnvironment;
            const accessGateEnabled = isAccessGateEnabled(environment);
            const appVersion = environment.VITE_APP_VERSION?.trim() || '0.0.0';
            const publicKeyConfiguration = environment.VITE_ACCESS_LEASE_PUBLIC_KEYS;
            const cloudConfigured = getSupabaseClient() !== null;
            const [authReady, setAuthReady] = React.useState(!accessGateEnabled);
            const [hasCloudSession, setHasCloudSession] = React.useState(false);
            const [signInOpen, setSignInOpen] = React.useState(false);
            const [signInMode, setSignInMode] = React.useState<'signin' | 'signup'>('signin');
            const runtime = React.useMemo(
              () => createInstalledRuntime(featureTier, appVersion, publicKeyConfiguration),
              [appVersion, featureTier, publicKeyConfiguration],
            );

            React.useEffect(() => {
              if (!accessGateEnabled) {
                setAuthReady(true);
                return undefined;
              }

              const client = getSupabaseClient();
              if (!client) {
                publishInstalledCloudSession(null);
                setHasCloudSession(false);
                setAuthReady(true);
                return undefined;
              }

              let active = true;
              const publish = (session: Session | null) => {
                if (!active) return;
                setHasCloudSession(publishInstalledCloudSession(session));
                setAuthReady(true);
              };

              void client.auth
                .getSession()
                .then(({ data, error }) => publish(error ? null : data.session))
                .catch(() => publish(null));

              const { data } = client.auth.onAuthStateChange((_event, session) => publish(session));
              return () => {
                active = false;
                data.subscription.unsubscribe();
              };
            }, [accessGateEnabled]);

            const openAuthentication = (mode: 'signin' | 'signup') => {
              setSignInMode(mode);
              setSignInOpen(true);
            };

            if (accessGateEnabled && !authReady) {
              return (
                <main className="flex min-h-screen items-center justify-center bg-background p-6">
                  <p className="text-sm text-muted-foreground" role="status" aria-live="polite">
                    Checking your VibeSpace session…
                  </p>
                </main>
              );
            }

            if (accessGateEnabled && !hasCloudSession) {
              return (
                <>
                  <InstalledCloudAuthentication
                    configured={cloudConfigured}
                    onSignIn={() => openAuthentication('signin')}
                    onCreateAccount={() => openAuthentication('signup')}
                  />
                  <SignInDialog
                    open={signInOpen}
                    onOpenChange={setSignInOpen}
                    initialMode={signInMode}
                  />
                </>
              );
            }

            return (
              <AccessAppHost
                enabled={accessGateEnabled}
                runtime={runtime}
                privacyUrl={safeHttpsUrl(environment.VITE_PRIVACY_URL)}
                termsUrl={safeHttpsUrl(environment.VITE_TERMS_URL)}
              >
                {children}
              </AccessAppHost>
            );
          }
          """
          replace_once(access_path, old_host, new_host)

          auth_test = """import * as React from 'react';
          import { cleanup, fireEvent, render, screen } from '@testing-library/react';
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';

          const authMock = vi.hoisted(() => ({
            getSession: vi.fn(),
            onAuthStateChange: vi.fn(),
            unsubscribe: vi.fn(),
          }));

          vi.mock('@/lib/supabase/client', () => ({
            getSupabaseClient: () => ({
              auth: {
                getSession: authMock.getSession,
                onAuthStateChange: authMock.onAuthStateChange,
              },
            }),
          }));

          vi.mock('@/features/auth/SignInDialog', () => ({
            SignInDialog: ({ open, initialMode }: { open: boolean; initialMode?: string }) =>
              open ? (
                <div role="dialog" aria-label="Cloud authentication" data-mode={initialMode}>
                  Authentication dialog
                </div>
              ) : null,
          }));

          import { InstalledAccessAppHost } from './AccessAppHost';
          import { useAuthStore } from '@/stores/auth';

          describe('InstalledAccessAppHost signed-out production boot', () => {
            beforeEach(() => {
              vi.stubEnv('VITE_ACCESS_GATE_ENABLED', 'true');
              authMock.getSession.mockReset();
              authMock.onAuthStateChange.mockReset();
              authMock.unsubscribe.mockReset();
              authMock.getSession.mockResolvedValue({ data: { session: null }, error: null });
              authMock.onAuthStateChange.mockReturnValue({
                data: { subscription: { unsubscribe: authMock.unsubscribe } },
              });
              useAuthStore.setState({ cloudSession: null, plan: 'free' });
            });

            afterEach(() => {
              cleanup();
              vi.unstubAllEnvs();
            });

            it('keeps sign-in and account creation reachable before Access checks the workspace', async () => {
              render(
                <InstalledAccessAppHost>
                  <p>Protected workspace</p>
                </InstalledAccessAppHost>,
              );

              expect(
                await screen.findByRole('heading', { name: 'Sign in to VibeSpace' }),
              ).toBeTruthy();
              expect(screen.queryByText('Protected workspace')).toBeNull();

              fireEvent.click(screen.getByRole('button', { name: 'Sign in' }));
              expect(screen.getByRole('dialog', { name: 'Cloud authentication' })).toHaveAttribute(
                'data-mode',
                'signin',
              );

              fireEvent.click(screen.getByRole('button', { name: 'Create account' }));
              expect(screen.getByRole('dialog', { name: 'Cloud authentication' })).toHaveAttribute(
                'data-mode',
                'signup',
              );
            });
          });
          """
          # The heredoc indentation is intentionally stripped before writing.
          auth_test = "\n".join(line[10:] if line.startswith("          ") else line for line in auth_test.splitlines()) + "\n"
          write("app/src/features/access/InstalledAccessAppHost.auth.test.tsx", auth_test)

          # -----------------------------------------------------------------
          # Shared, bounded server-side SemVer and authoritative prelaunch test.
          # -----------------------------------------------------------------
          app_version = """export type ServerAppVersionResolution =
            | { readonly kind: 'version'; readonly value: string }
            | { readonly kind: 'missing' }
            | { readonly kind: 'invalid' };

          const MAX_APP_VERSION_LENGTH = 128;
          const SEMVER =
            /^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-([0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*))?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/;

          export function resolveServerAppVersion(
            value: string | null | undefined,
          ): ServerAppVersionResolution {
            if (value == null || value.trim() === '') return { kind: 'missing' };
            const normalized = value.trim();
            if (normalized.length > MAX_APP_VERSION_LENGTH) return { kind: 'invalid' };
            const match = SEMVER.exec(normalized);
            if (!match) return { kind: 'invalid' };
            const prerelease = match[4];
            if (
              prerelease?.split('.').some(
                (identifier) => /^\\d+$/.test(identifier) && identifier.length > 1 && identifier[0] === '0',
              )
            ) {
              return { kind: 'invalid' };
            }
            return { kind: 'version', value: normalized };
          }

          export function isAuthoritativePrelaunchConfig(
            value: unknown,
            nowMs: number = Date.now(),
          ): boolean {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
            const config = value as { enabled?: unknown; launch_at?: unknown };
            if (config.enabled === false) return true;
            if (config.enabled !== true || typeof config.launch_at !== 'string') return false;
            const launchAtMs = Date.parse(config.launch_at);
            return Number.isFinite(launchAtMs) && nowMs < launchAtMs;
          }
          """
          app_version = "\n".join(line[10:] if line.startswith("          ") else line for line in app_version.splitlines()) + "\n"
          write("supabase/functions/_shared/appVersion.ts", app_version)

          app_version_test = """import assert from 'node:assert/strict';
          import { describe, it } from 'node:test';
          import {
            isAuthoritativePrelaunchConfig,
            resolveServerAppVersion,
          } from './appVersion.ts';

          describe('resolveServerAppVersion', () => {
            it('accepts bounded SemVer and normalizes surrounding whitespace', () => {
              assert.deepEqual(resolveServerAppVersion(' 1.5.0 '), {
                kind: 'version',
                value: '1.5.0',
              });
              assert.equal(resolveServerAppVersion('1.5.0-rc.1+build.7').kind, 'version');
            });

            it('distinguishes missing configuration and rejects malformed or ambiguous versions', () => {
              assert.deepEqual(resolveServerAppVersion(undefined), { kind: 'missing' });
              assert.deepEqual(resolveServerAppVersion(''), { kind: 'missing' });
              for (const value of ['1', 'v1.5.0', '01.5.0', '1.5.0-01', '1.5.0.1']) {
                assert.deepEqual(resolveServerAppVersion(value), { kind: 'invalid' }, value);
              }
            });
          });

          describe('isAuthoritativePrelaunchConfig', () => {
            it('allows only a disabled or not-yet-launched authoritative gate', () => {
              const now = Date.parse('2026-08-02T00:00:00Z');
              assert.equal(isAuthoritativePrelaunchConfig({ enabled: false, launch_at: null }, now), true);
              assert.equal(
                isAuthoritativePrelaunchConfig(
                  { enabled: true, launch_at: '2026-08-03T00:00:00Z' },
                  now,
                ),
                true,
              );
              assert.equal(isAuthoritativePrelaunchConfig({ enabled: true, launch_at: null }, now), false);
              assert.equal(
                isAuthoritativePrelaunchConfig(
                  { enabled: true, launch_at: '2026-08-01T00:00:00Z' },
                  now,
                ),
                false,
              );
              assert.equal(isAuthoritativePrelaunchConfig(null, now), false);
            });
          });
          """
          app_version_test = "\n".join(line[10:] if line.startswith("          ") else line for line in app_version_test.splitlines()) + "\n"
          write("supabase/functions/_shared/appVersion.test.ts", app_version_test)

          # -----------------------------------------------------------------
          # P1: call-start uses APP_VERSION and fails closed before side effects.
          # -----------------------------------------------------------------
          call_path = "supabase/functions/call-start/index.ts"
          replace_once(
              call_path,
              "import { evaluateAppAccessGate } from '../_shared/appAccessGate.ts';\n",
              "import { evaluateAppAccessGate } from '../_shared/appAccessGate.ts';\nimport { resolveServerAppVersion } from '../_shared/appVersion.ts';\n",
          )
          replace_once(
              call_path,
              """  let access: AppAccessResponse | null;
            try {
              access = await deps.getAppAccess(jwt, deps.appVersion);
            } catch {
              access = null;
            }
          """,
              """  const configuredVersion = resolveServerAppVersion(deps.appVersion);
            if (configuredVersion.kind !== 'version') {
              return json({ error: 'access_unavailable' }, 503, origin);
            }

            let access: AppAccessResponse | null;
            try {
              access = await deps.getAppAccess(jwt, configuredVersion.value);
            } catch {
              access = null;
            }
          """,
          )
          replace_once(
              call_path,
              """  const INSTALLED_APP_VERSION =
              (_Deno.env.get('INSTALLED_APP_VERSION') ?? '').trim().slice(0, 128) || undefined;
          """,
              """  const APP_VERSION = _Deno.env.get('APP_VERSION');
          """,
          )
          replace_once(call_path, "    appVersion: INSTALLED_APP_VERSION,\n", "    appVersion: APP_VERSION,\n")

          call_test_path = "supabase/functions/call-start/index.test.ts"
          call_test = read(call_test_path)
          regression = """

          describe('call-start server app version', () => {
            it('fails closed before access, budget, or provider work when APP_VERSION is absent', async () => {
              const log: CallLog = { order: [] };
              const deps = makeDeps({ appVersion: undefined }, log);
              const res = await handleCallStart(deps, postReq({ to: VALID_NUMBER }));

              assert.equal(res.status, 503);
              assert.deepEqual(await json(res), { error: 'access_unavailable' });
              assert.ok(!log.order.includes('getAppAccess'));
              assert.ok(!log.order.includes('reserveBudget'));
              assert.ok(!log.order.includes('callProvider'));
            });

            it('fails closed on malformed server versions rather than entering prelaunch', async () => {
              const log: CallLog = { order: [] };
              const deps = makeDeps({ appVersion: 'not-a-semver' }, log);
              const res = await handleCallStart(deps, postReq({ to: VALID_NUMBER }));

              assert.equal(res.status, 503);
              assert.ok(!log.order.includes('getAppAccess'));
              assert.ok(!log.order.includes('reserveBudget'));
            });
          });
          """
          regression = "\n".join(line[10:] if line.startswith("          ") else line for line in regression.splitlines()) + "\n"
          if "call-start server app version" not in call_test:
              write(call_test_path, call_test.rstrip() + regression)

          # -----------------------------------------------------------------
          # P1: TTS permits missing version only during authoritative prelaunch.
          # -----------------------------------------------------------------
          tts_path = "supabase/functions/tts-speak/index.ts"
          replace_once(
              tts_path,
              "import { evaluateAppAccessGate } from '../_shared/appAccessGate.ts';\n",
              "import { evaluateAppAccessGate } from '../_shared/appAccessGate.ts';\nimport {\n  isAuthoritativePrelaunchConfig,\n  resolveServerAppVersion,\n} from '../_shared/appVersion.ts';\n",
          )
          replace_once(
              tts_path,
              "const APP_VERSION = Deno.env.get('APP_VERSION') ?? '';\n",
              "const APP_VERSION = resolveServerAppVersion(Deno.env.get('APP_VERSION'));\n",
          )
          replace_once(
              tts_path,
              """  if (!APP_VERSION) return json({ error: 'access_unavailable' }, 503, origin);
            let accessData: unknown;
            let accessError: unknown;
            try {
              ({ data: accessData, error: accessError } = await userClient.rpc('get_app_access', {
                p_app_version: APP_VERSION,
              }));
            } catch {
              return json({ error: 'access_unavailable' }, 503, origin);
            }
          """,
              """  let appVersion: string | null = null;
            if (APP_VERSION.kind === 'version') {
              appVersion = APP_VERSION.value;
            } else {
              // Missing/malformed server configuration is tolerated only while
              // the authoritative launch row says the gate is disabled or still
              // scheduled in the future. Once launched, fail closed so a null
              // version cannot be interpreted as a usable prelaunch build.
              try {
                const { data: launchConfig, error: launchConfigError } = await userClient
                  .from('app_access_launch_config')
                  .select('enabled, launch_at')
                  .eq('id', 1)
                  .maybeSingle();
                if (launchConfigError || !isAuthoritativePrelaunchConfig(launchConfig)) {
                  return json({ error: 'access_unavailable' }, 503, origin);
                }
              } catch {
                return json({ error: 'access_unavailable' }, 503, origin);
              }
            }

            let accessData: unknown;
            let accessError: unknown;
            try {
              ({ data: accessData, error: accessError } = await userClient.rpc('get_app_access', {
                p_app_version: appVersion,
              }));
            } catch {
              return json({ error: 'access_unavailable' }, 503, origin);
            }
          """,
          )

          tts_test = """import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const source = readFileSync(new URL('./index.ts', import.meta.url), 'utf8');

          function position(fragment: string): number {
            const index = source.indexOf(fragment);
            assert.notEqual(index, -1, `missing source fragment: ${fragment}`);
            return index;
          }

          test('checks authoritative app access under the user JWT before billable work', () => {
            assert.match(
              source,
              /createClient\\(SUPABASE_URL, SUPABASE_ANON_KEY, \\{[\\s\\S]*?Authorization: `Bearer \\$\\{jwt\\}`/,
            );
            const auth = position('await userClient.auth.getUser(jwt)');
            const access = position("await userClient.rpc('get_app_access'");
            const admin = position("await admin.rpc('is_app_admin'");
            const rate = position("await admin.rpc('voice_rate_limit_hit'");
            const reserve = position(".rpc('reserve_call_budget'");
            const provider = position('audio = await callOpenAI');

            assert.ok(auth < access);
            assert.ok(access < admin);
            assert.ok(access < rate);
            assert.ok(access < reserve);
            assert.ok(access < provider);
          });

          test('uses the shared server app version and fails closed on access ambiguity', () => {
            assert.match(
              source,
              /const APP_VERSION = resolveServerAppVersion\\(Deno\\.env\\.get\\('APP_VERSION'\\)\\)/,
            );
            assert.match(source, /p_app_version:\\s*appVersion/);
            assert.match(
              source,
              /import \\{[\\s\\S]*?isAuthoritativePrelaunchConfig,[\\s\\S]*?resolveServerAppVersion,[\\s\\S]*?\\} from '\.\.\\/_shared\\/appVersion\\.ts'/,
            );
            assert.match(
              source,
              /import \\{ evaluateAppAccessGate \\} from '\.\.\\/_shared\\/appAccessGate\\.ts'/,
            );
            assert.match(source, /const accessDecision = evaluateAppAccessGate\\(accessData\\)/);
            assert.match(source, /accessDecision\\.kind !== 'allow'/);
            assert.doesNotMatch(source, /USABLE_APP_ACCESS_STATUSES/);
            assert.doesNotMatch(source, /function isUsableAppAccess/);
            assert.doesNotMatch(source, /body\\.(?:appVersion|app_version|canUseApp|accessStatus)/);
          });

          test('allows absent version only under the authoritative prelaunch row', () => {
            const auth = position('await userClient.auth.getUser(jwt)');
            const launchConfig = position(".from('app_access_launch_config')");
            const access = position("await userClient.rpc('get_app_access'");
            const provider = position('audio = await callOpenAI');

            assert.ok(auth < launchConfig);
            assert.ok(launchConfig < access);
            assert.ok(access < provider);
            assert.match(source, /APP_VERSION\\.kind === 'version'/);
            assert.match(source, /!isAuthoritativePrelaunchConfig\\(launchConfig\\)/);
            assert.match(
              source,
              /launchConfigError \\|\\| !isAuthoritativePrelaunchConfig\\(launchConfig\\)[\\s\\S]*?access_unavailable/,
            );
          });

          test('denied or unavailable app access returns safely before provider and billing effects', () => {
            assert.match(
              source,
              /if \\(accessError\\)\\s*return json\\(\\{ error: 'access_unavailable' \\}, 503, origin\\)/,
            );
            assert.match(
              source,
              /if \\(accessDecision\\.kind !== 'allow'\\)\\s*return json\\(\\{ error: 'app_access_denied' \\}, 403, origin\\)/,
            );
            assert.doesNotMatch(source, /^const (?:OPENAI|DEEPGRAM|ELEVENLABS)_API_KEY/m);
          });

          test('bounds dependency failures and never turns post-provider bookkeeping into a retryable throw', () => {
            assert.match(
              source,
              /try \\{\\s*const \\{ data: appAdminFlag, error: appAdminError \\} = await admin\\.rpc\\('is_app_admin'/,
            );
            assert.match(
              source,
              /if \\(appAdminError\\) return json\\(\\{ error: 'usage_unavailable' \\}, 503, origin\\)/,
            );
            assert.match(source, /catch \\{\\s*return json\\(\\{ error: 'usage_unavailable' \\}, 503, origin\\)/);
            assert.match(source, /async function settleAndAudit/);
            assert.match(source, /await settleAndAudit\\([\\s\\S]*?\\)\\.catch\\(\\(\\) => undefined\\)/);
          });
          """
          tts_test = "\n".join(line[10:] if line.startswith("          ") else line for line in tts_test.splitlines()) + "\n"
          write("supabase/functions/tts-speak/index.test.ts", tts_test)

          # -----------------------------------------------------------------
          # Deployment contract: one exact server/client version name.
          # -----------------------------------------------------------------
          env_path = ".env.example"
          replace_once(env_path, "VITE_APP_VERSION=0.1.0\n", "VITE_APP_VERSION=1.5.0\n")
          replace_once(
              env_path,
              "# Supabase service role key — used by the edge function to update\n",
              "# Exact SemVer used by server-authoritative Access checks. Keep this in sync with\n# VITE_APP_VERSION and the signed desktop release. Set it as a Supabase secret.\nAPP_VERSION=1.5.0\n\n# Supabase service role key — used by the edge function to update\n",
          )

          runbook_path = "docs/stripe-setup.md"
          replace_once(
              runbook_path,
              "| `APP_BASE_URL`                | Operator-set          | Exact credential-free HTTPS public origin                        |\n",
              "| `APP_BASE_URL`                | Operator-set          | Exact credential-free HTTPS public origin                        |\n| `APP_VERSION`                 | Operator-set          | Exact signed desktop SemVer used by server Access authorization  |\n",
          )
          replace_once(
              runbook_path,
              "`ACCESS_LEASE_SIGNING_JWK` must be a private P-256 JWK with signing use and must never reach the\n",
              "`APP_VERSION` must be a bounded SemVer matching `VITE_APP_VERSION` and the exact signed desktop\nrelease. Configure it before deploying any Access-aware Edge Function. `call-start` fails closed\nwhen it is missing or malformed. Cloud TTS tolerates a missing value only while the authoritative\nlaunch row is disabled or scheduled in the future; after launch it also fails closed.\n\n`ACCESS_LEASE_SIGNING_JWK` must be a private P-256 JWK with signing use and must never reach the\n",
          )

          checklist_path = "docs/access-release-checklist.md"
          replace_once(
              checklist_path,
              "- [ ] Required platform and operator secrets exist without being copied into evidence.\n",
              "- [ ] Required platform and operator secrets exist without being copied into evidence.\n- [ ] Server `APP_VERSION` is valid SemVer and exactly matches `VITE_APP_VERSION` plus the signed release.\n",
          )

          # Remove every temporary workflow from the exact result tree.
          for workflow in [
              ".github/workflows/pr30-sync-main-once.yml",
              ".github/workflows/pr30-vitest-diagnostic.yml",
              ".github/workflows/pr30-production-fixes-once.yml",
          ]:
              path = Path(workflow)
              if path.exists():
                  path.unlink()
          PY

          # Verify the intended integrated product surfaces before committing.
          test -f docs/ideas/TASKBAR_AI_USAGE_MODULE.md
          test -f docs/operations/VIBESPACE_AUDIT_LOG.md
          test -f site/css/site-appearance.css
          test -f site/css/system-model.css
          test -f site/js/site-appearance.js
          test -f site/js/system-model.js
          grep -q 'href="/access/"' site/index.html
          grep -q 'css/site-appearance.css' site/index.html
          grep -q 'js/site-appearance.js' site/index.html
          grep -q "Sign in to VibeSpace" app/src/features/access/AccessAppHost.tsx
          grep -q "Deno.env.get('APP_VERSION')" supabase/functions/call-start/index.ts
          grep -q "isAuthoritativePrelaunchConfig" supabase/functions/tts-speak/index.ts

          git add -A
          git commit -m "fix: resolve PR 30 production access blockers"

          RESULT_SHA="$(git rev-parse HEAD)"
          printf 'START_SHA=%s\nMAIN_SHA=%s\nMERGE_BASE_SHA=%s\nRESULT_SHA=%s\n' \
            "$START_SHA" "$MAIN_SHA" "$MERGE_BASE_SHA" "$RESULT_SHA" > pr30-production.env

          git branch -f pr30-production-result "$RESULT_SHA"
          git bundle create pr30-production.bundle \
            pr30-production-result "^$START_SHA" "^$MAIN_SHA"
          git bundle verify pr30-production.bundle

          git diff --check "$START_SHA..$RESULT_SHA" -- . \
            ':(exclude)docs/ideas/TASKBAR_AI_USAGE_MODULE.md'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: |
            pr30-production.bundle
            pr30-production.env
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Verify frontend, Edge contracts, build, Vitest, and release manifest
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-production

      - name: Check out exact production result
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-production/pr30-production.env
          git fetch .pr30-production/pr30-production.bundle \
            refs/heads/pr30-production-result:refs/remotes/pr30-production/result
          test "$(git rev-parse refs/remotes/pr30-production/result)" = "$RESULT_SHA"
          git checkout --detach "$RESULT_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Test Edge access and version contracts
        run: >-
          node --test
          supabase/functions/_shared/appVersion.test.ts
          supabase/functions/_shared/appAccessGate.test.ts
          supabase/functions/call-start/index.test.ts
          supabase/functions/tts-speak/index.test.ts

      - name: Test full frontend suite
        run: npm --prefix app run test

      - name: Test release manifest
        run: npm run test:release-manifest

  rust:
    name: Verify Rust release check
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-production

      - name: Check out exact production result
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-production/pr30-production.env
          git fetch .pr30-production/pr30-production.bundle \
            refs/heads/pr30-production-result:refs/remotes/pr30-production/result
          test "$(git rev-parse refs/remotes/pr30-production/result)" = "$RESULT_SHA"
          git checkout --detach "$RESULT_SHA"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check --release
        working-directory: app/src-tauri
        run: cargo check --release

  publish:
    name: Publish verified production result to PR 30
    needs: [prepare, frontend, rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-production

      - name: Verify branch stability and fast-forward
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-production/pr30-production.env
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$START_SHA" ]; then
            echo "PR branch moved during verification; refusing to overwrite it."
            echo "Expected: $START_SHA"
            echo "Current:  $CURRENT_SHA"
            exit 1
          fi

          git fetch .pr30-production/pr30-production.bundle \
            refs/heads/pr30-production-result:refs/remotes/pr30-production/result
          test "$(git rev-parse refs/remotes/pr30-production/result)" = "$RESULT_SHA"
          git merge-base --is-ancestor "$START_SHA" "$RESULT_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$RESULT_SHA"

          for workflow in \
            .github/workflows/pr30-sync-main-once.yml \
            .github/workflows/pr30-vitest-diagnostic.yml \
            .github/workflows/pr30-production-fixes-once.yml; do
            if git ls-tree -r --name-only "$RESULT_SHA" | grep -qx "$workflow"; then
              echo "Temporary workflow remains in final tree: $workflow"
              exit 1
            fi
          done

          git push origin "$RESULT_SHA:refs/heads/$PR30_BRANCH"
