name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare synchronized v1.5.0 commit
    if: github.head_ref == 'release/v1.5.0'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v1.5.0
          fetch-depth: 0

      - name: Generate release commit
        id: prepare
        shell: bash
        run: |
          exec > >(tee release-prep.log) 2>&1
          set -euo pipefail
          git fetch origin main
          node scripts/prepare-v1-5-release.mjs
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f release-prep.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare official VibeSpace v1.5.0"
          git push origin HEAD:release/v1.5.0

      - name: Upload preparation failure log
        if: failure() && steps.prepare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v1-5-release-prep-log
          path: release-prep.log
          if-no-files-found: warn
          retention-days: 7
