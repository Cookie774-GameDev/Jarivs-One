# Run typecheck, builds, tests, and backend policy checks on pull requests and main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build + test)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase Edge Function JWT policy parity
        id: supabase-parity
        shell: bash
        run: |
          set +e
          node scripts/check-supabase-function-parity.mjs > supabase-parity-report.txt 2>&1
          code=$?
          cat supabase-parity-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Supabase parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-parity-report
          path: supabase-parity-report.txt
          retention-days: 7

      - name: Enforce Supabase policy parity
        if: steps.supabase-parity.outputs.exit_code != '0'
        run: exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Test (vitest)
        run: npm --prefix app run test

      - name: Test release manifest
        run: npm run test:release-manifest

  rust:
    name: Rust (cargo check)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --release
