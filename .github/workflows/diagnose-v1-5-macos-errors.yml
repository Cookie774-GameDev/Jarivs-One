name: Extract VibeSpace v1.5.0 macOS errors

on:
  create:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.ref_type == 'branch' && github.ref_name == 'diagnose-v1.5.0-macos-errors'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Extract only failure lines
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/jobs/87524666509/logs > job.log
          python - <<'PY' > errors.log
          import re
          from pathlib import Path
          text = Path('job.log').read_text(errors='replace').splitlines()
          pattern = re.compile(r'(error|failed|failure|panic|private key|signing|signature|bundle|tauri-action|could not|not found|invalid)', re.I)
          matches = [(i, line) for i, line in enumerate(text) if pattern.search(line)]
          selected = []
          for i, _ in matches[-40:]:
              start = max(0, i - 2)
              end = min(len(text), i + 4)
              selected.extend(text[start:end])
          out = []
          seen = set()
          for line in selected:
              if line not in seen:
                  seen.add(line)
                  out.append(line)
          print('\n'.join(out[-180:]))
          PY
          {
            echo 'Apple Silicon concise release error:'
            echo '```text'
            cat errors.log
            echo '```'
          } > comment.md
          gh pr comment 27 --repo "$GITHUB_REPOSITORY" --body-file comment.md
