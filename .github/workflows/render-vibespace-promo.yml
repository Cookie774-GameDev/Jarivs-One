name: Render VibeSpace promo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'video/**'
      - '.github/workflows/render-vibespace-promo.yml'

permissions:
  contents: read

jobs:
  render:
    name: Render 30-second MP4
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: video

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install video dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck composition
        run: npm run typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npm run render -- --concurrency=2

      - name: Render poster
        run: npm run still

      - name: Upload rendered media
        uses: actions/upload-artifact@v4
        with:
          name: vibespace-promo-30s
          path: |
            video/out/vibespace-promo.mp4
            video/out/vibespace-promo-poster.png
          if-no-files-found: error
          retention-days: 14
