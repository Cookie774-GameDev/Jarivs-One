name: Inspect VibeSpace v1.5.0 release

on:
  create:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    if: github.ref_type == 'branch' && github.ref_name == 'inspect-v1.5.0'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report current v1.5.0 Release run
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch v1.5.0 --limit 5 --json databaseId,status,conclusion,event,headBranch,url,createdAt)"
          body="$(jq -r 'if length == 0 then "No v1.5.0 Release run is visible yet." else .[] | "Release run ID: \(.databaseId) | status: \(.status) | conclusion: \(.conclusion // \"pending\") | event: \(.event) | URL: \(.url)" end' <<< "$runs")"
          gh pr comment 27 --repo "$GITHUB_REPOSITORY" --body "$body"
