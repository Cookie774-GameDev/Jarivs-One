name: PR 30 production candidate final verification

on:
  push:
    branches:
      - codex/shared-intelligence-kernel-design-20260716
    paths:
      - .github/workflows/pr30-production-finalize-once.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: pr30-production-finalize-once
  cancel-in-progress: false

env:
  PR30_BRANCH: codex/shared-intelligence-kernel-design-20260716
  PRIOR_RUN_ID: "30727047782"
  RESUME_RUN_ID: "30727173937"
  RESULT_ARTIFACT: pr30-production-final-result

jobs:
  prepare:
    name: Assemble self-contained verified candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download original production candidate
        uses: actions/download-artifact@v4
        with:
          name: pr30-production-result
          path: .prior-production
          github-token: ${{ github.token }}
          run-id: ${{ env.PRIOR_RUN_ID }}

      - name: Download assertion-patched candidate
        uses: actions/download-artifact@v4
        with:
          name: pr30-production-resume-result
          path: .resume-production
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_RUN_ID }}

      - name: Assemble final candidate and remove every temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT_SHA="$(git rev-parse HEAD)"

          source .prior-production/pr30-production.env
          PRIOR_RESULT_SHA="$RESULT_SHA"
          PRIOR_MAIN_SHA="$MAIN_SHA"
          git fetch .prior-production/pr30-production.bundle \
            refs/heads/pr30-production-result:refs/remotes/pr30-production/result
          test "$(git rev-parse refs/remotes/pr30-production/result)" = "$PRIOR_RESULT_SHA"

          source .resume-production/pr30-resume.env
          RESUMED_SHA="$FINAL_SHA"
          test "$PRIOR_RESULT_SHA" = "$PRIOR_RESULT_SHA"
          git fetch .resume-production/pr30-resume.bundle \
            refs/heads/pr30-resume-result:refs/remotes/pr30-resume/result
          test "$(git rev-parse refs/remotes/pr30-resume/result)" = "$RESUMED_SHA"

          git merge-base --is-ancestor "$PRIOR_RESULT_SHA" "$RESUMED_SHA"
          git merge-base --is-ancestor "$PRIOR_MAIN_SHA" "$RESUMED_SHA"
          git merge --no-ff "$RESUMED_SHA" \
            -m "Integrate the patched PR 30 production candidate"

          for workflow in \
            .github/workflows/pr30-sync-main-once.yml \
            .github/workflows/pr30-vitest-diagnostic.yml \
            .github/workflows/pr30-production-fixes-once.yml \
            .github/workflows/pr30-production-resume-once.yml \
            .github/workflows/pr30-production-finalize-once.yml; do
            if [ -f "$workflow" ]; then
              git rm "$workflow"
            fi
          done

          git commit -m "chore: remove one-time PR 30 verification helpers"

          FINAL_SHA="$(git rev-parse HEAD)"
          printf 'CURRENT_SHA=%s\nPRIOR_RESULT_SHA=%s\nPRIOR_MAIN_SHA=%s\nRESUMED_SHA=%s\nFINAL_SHA=%s\n' \
            "$CURRENT_SHA" "$PRIOR_RESULT_SHA" "$PRIOR_MAIN_SHA" "$RESUMED_SHA" "$FINAL_SHA" \
            > pr30-final.env

          git branch -f pr30-final-result "$FINAL_SHA"
          # Include every side-branch object not already available from the
          # exact current PR head. Verification jobs therefore need only their
          # normal full checkout plus this bounded bundle.
          git bundle create pr30-final.bundle pr30-final-result "^$CURRENT_SHA"
          git bundle verify pr30-final.bundle

          git merge-base --is-ancestor "$CURRENT_SHA" "$FINAL_SHA"
          git merge-base --is-ancestor "$PRIOR_RESULT_SHA" "$FINAL_SHA"
          git merge-base --is-ancestor "$PRIOR_MAIN_SHA" "$FINAL_SHA"
          git merge-base --is-ancestor "$RESUMED_SHA" "$FINAL_SHA"
          git diff --check "$CURRENT_SHA..$FINAL_SHA" -- . \
            ':(exclude)docs/ideas/TASKBAR_AI_USAGE_MODULE.md'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: |
            pr30-final.bundle
            pr30-final.env
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Verify TypeScript, build, Edge contracts, Vitest, and release manifest
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-final

      - name: Check out exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-final/pr30-final.env
          test "$(git rev-parse HEAD)" = "$CURRENT_SHA"
          git fetch .pr30-final/pr30-final.bundle \
            refs/heads/pr30-final-result:refs/remotes/pr30-final/result
          test "$(git rev-parse refs/remotes/pr30-final/result)" = "$FINAL_SHA"
          git checkout --detach "$FINAL_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Test Edge access and version contracts
        run: >-
          node --test
          supabase/functions/_shared/appVersion.test.ts
          supabase/functions/_shared/appAccessGate.test.ts
          supabase/functions/call-start/index.test.ts
          supabase/functions/tts-speak/index.test.ts

      - name: Test full frontend suite
        run: npm --prefix app run test

      - name: Test release manifest
        run: npm run test:release-manifest

  rust:
    name: Verify Rust release check
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-final

      - name: Check out exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-final/pr30-final.env
          test "$(git rev-parse HEAD)" = "$CURRENT_SHA"
          git fetch .pr30-final/pr30-final.bundle \
            refs/heads/pr30-final-result:refs/remotes/pr30-final/result
          test "$(git rev-parse refs/remotes/pr30-final/result)" = "$FINAL_SHA"
          git checkout --detach "$FINAL_SHA"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check --release
        working-directory: app/src-tauri
        run: cargo check --release

  publish:
    name: Publish exact verified candidate to PR 30
    needs: [prepare, frontend, rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR30_BRANCH }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: .pr30-final

      - name: Verify branch stability and fast-forward
        shell: bash
        run: |
          set -euo pipefail
          source .pr30-final/pr30-final.env

          CURRENT_REMOTE_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_REMOTE_SHA" != "$CURRENT_SHA" ]; then
            echo "PR branch moved during verification; refusing to overwrite it."
            echo "Expected: $CURRENT_SHA"
            echo "Current:  $CURRENT_REMOTE_SHA"
            exit 1
          fi

          git fetch .pr30-final/pr30-final.bundle \
            refs/heads/pr30-final-result:refs/remotes/pr30-final/result
          test "$(git rev-parse refs/remotes/pr30-final/result)" = "$FINAL_SHA"
          git merge-base --is-ancestor "$CURRENT_SHA" "$FINAL_SHA"
          git merge-base --is-ancestor "$PRIOR_RESULT_SHA" "$FINAL_SHA"
          git merge-base --is-ancestor "$PRIOR_MAIN_SHA" "$FINAL_SHA"
          git merge-base --is-ancestor "$RESUMED_SHA" "$FINAL_SHA"

          for workflow in \
            .github/workflows/pr30-sync-main-once.yml \
            .github/workflows/pr30-vitest-diagnostic.yml \
            .github/workflows/pr30-production-fixes-once.yml \
            .github/workflows/pr30-production-resume-once.yml \
            .github/workflows/pr30-production-finalize-once.yml; do
            if git ls-tree -r --name-only "$FINAL_SHA" | grep -qx "$workflow"; then
              echo "Temporary workflow remains in final tree: $workflow"
              exit 1
            fi
          done

          git push origin "$FINAL_SHA:refs/heads/$PR30_BRANCH"
