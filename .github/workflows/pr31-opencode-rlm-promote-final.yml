name: PR31 OpenCode RLM differential finalize

on:
  push:
    branches: [agent/pr31-opencode-rlm-verify-a6f1]
    paths: [.github/workflows/pr31-opencode-rlm-promote-final.yml]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr31-opencode-rlm-differential-finalize
  cancel-in-progress: false

env:
  BASE_SHA: 4209030eb041c661ee1a4b55e87367136638762b
  STAGING_SHA: e0c11422a5d038231cdfa73bf3f48dffc7554f51
  TARGET_BRANCH: agent/pr30-fixes-and-updates
  PR_NUMBER: '31'

jobs:
  verify-build-rust-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.STAGING_SHA }}
          fetch-depth: 0

      - name: Guard locked source and target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$STAGING_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$STAGING_SHA"
          git diff --check "$BASE_SHA...$STAGING_SHA"
          git diff --name-only "$BASE_SHA...$STAGING_SHA" | sort > "$RUNNER_TEMP/changed-files.txt"
          printf 'BASE_SHA=%s\nSTAGING_SHA=%s\n' "$BASE_SHA" "$STAGING_SHA" > "$RUNNER_TEMP/guard.txt"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install staged frozen dependencies
        run: npm ci --no-audit --no-fund

      - name: Differential full Vitest identity gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/pr31-base"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          (cd "$BASE_DIR" && npm ci --no-audit --no-fund)

          run_suite() {
            local tree="$1" out="$2" log="$3" code="$4"
            set +e
            (cd "$tree/app" && "$tree/node_modules/.bin/vitest" run --reporter=json --outputFile="$out") >"$log" 2>&1
            printf '%s\n' "$?" > "$code"
            set -e
            test -s "$out"
          }
          run_suite "$BASE_DIR" "$RUNNER_TEMP/base-results.json" "$RUNNER_TEMP/base-vitest.log" "$RUNNER_TEMP/base-exit.txt"
          run_suite "$GITHUB_WORKSPACE" "$RUNNER_TEMP/staged-results.json" "$RUNNER_TEMP/staged-vitest.log" "$RUNNER_TEMP/staged-exit.txt"

          node - "$BASE_DIR" "$RUNNER_TEMP/base-results.json" "$RUNNER_TEMP/BASE_FAILURES.txt" "$RUNNER_TEMP/base-summary.json" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/staged-results.json" "$RUNNER_TEMP/STAGED_FAILURES.txt" "$RUNNER_TEMP/staged-summary.json" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const clean = v => String(v ?? '').replace(/\s+/gu, ' ').trim();
          function parse(root, input, failures, summary) {
            const report = JSON.parse(fs.readFileSync(input, 'utf8'));
            const suites = Array.isArray(report.testResults) ? report.testResults : [];
            const ids = [];
            let passed = 0, failed = 0, skipped = 0;
            for (const suite of suites) {
              const file = path.relative(root, suite.name || suite.filepath || suite.file || '[unknown]').split(path.sep).join('/');
              let assertionFailures = 0;
              for (const test of suite.assertionResults ?? []) {
                const status = String(test.status || '').toLowerCase();
                if (status === 'passed') passed++;
                else if (status === 'failed') {
                  failed++; assertionFailures++;
                  const full = clean(test.fullName) || [...(test.ancestorTitles ?? []).map(clean), clean(test.title)].filter(Boolean).join(' > ');
                  ids.push(`${file} :: ${full || '[unnamed failed test]'}`);
                } else skipped++;
              }
              if (String(suite.status || '').toLowerCase() === 'failed' && assertionFailures === 0) {
                failed++;
                ids.push(`${file} :: [suite failure] ${clean(suite.message || (suite.failureMessages ?? []).join(' ') || 'suite load/runtime failure').slice(0, 600)}`);
              }
            }
            const unique = [...new Set(ids)].sort();
            fs.writeFileSync(failures, unique.length ? unique.join('\n') + '\n' : '');
            fs.writeFileSync(summary, JSON.stringify({files:suites.length, passed, failed, skipped, failureIdentities:unique.length}, null, 2) + '\n');
          }
          const a = process.argv.slice(2);
          parse(a[0], a[1], a[2], a[3]);
          parse(a[4], a[5], a[6], a[7]);
          NODE

          comm -13 "$RUNNER_TEMP/BASE_FAILURES.txt" "$RUNNER_TEMP/STAGED_FAILURES.txt" > "$RUNNER_TEMP/NEW_FAILURES.txt"
          comm -23 "$RUNNER_TEMP/BASE_FAILURES.txt" "$RUNNER_TEMP/STAGED_FAILURES.txt" > "$RUNNER_TEMP/FIXED_FAILURES.txt"
          base_files="$(node -p "require('$RUNNER_TEMP/base-summary.json').files")"
          staged_files="$(node -p "require('$RUNNER_TEMP/staged-summary.json').files")"
          base_passed="$(node -p "require('$RUNNER_TEMP/base-summary.json').passed")"
          staged_passed="$(node -p "require('$RUNNER_TEMP/staged-summary.json').passed")"
          test "$base_files" -ge 1000
          test "$staged_files" -ge 1000
          test "$base_passed" -ge 9000
          test "$staged_passed" -ge 9000
          base_count="$(wc -l < "$RUNNER_TEMP/BASE_FAILURES.txt" | tr -d ' ')"
          staged_count="$(wc -l < "$RUNNER_TEMP/STAGED_FAILURES.txt" | tr -d ' ')"
          new_count="$(wc -l < "$RUNNER_TEMP/NEW_FAILURES.txt" | tr -d ' ')"
          fixed_count="$(wc -l < "$RUNNER_TEMP/FIXED_FAILURES.txt" | tr -d ' ')"
          printf 'BASE_FAILURE_IDENTITIES=%s\nSTAGED_FAILURE_IDENTITIES=%s\nNEW_FAILURE_IDENTITIES=%s\nFIXED_FAILURE_IDENTITIES=%s\n' \
            "$base_count" "$staged_count" "$new_count" "$fixed_count" | tee "$RUNNER_TEMP/differential-summary.txt"
          echo '--- BASE ---'; cat "$RUNNER_TEMP/base-summary.json"; cat "$RUNNER_TEMP/BASE_FAILURES.txt" || true
          echo '--- STAGED ---'; cat "$RUNNER_TEMP/staged-summary.json"; cat "$RUNNER_TEMP/STAGED_FAILURES.txt" || true
          echo '--- NEW ---'; cat "$RUNNER_TEMP/NEW_FAILURES.txt" || true
          test "$new_count" = 0
          if [ "$staged_count" -gt 0 ]; then
            ! grep -Ev '^(app/src/App\.accountIdentity\.test\.tsx|app/src/features/news/NewsPanel\.live\.test\.tsx|app/src/features/benchmarks/BenchmarkIntelligencePage\.test\.tsx) :: ' "$RUNNER_TEMP/STAGED_FAILURES.txt"
          fi
          git worktree remove --force "$BASE_DIR"

      - name: Focused OpenCode RLM pack 214 of 214
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vitest run \
            src/lib/ai/useAccessibleChatModels.test.ts \
            src/lib/ai/useAccessibleChatModels.smoke.test.ts \
            src/lib/ai/modelSelection.test.ts \
            src/lib/ai/modelSelection.smoke.test.ts \
            src/lib/ai/adapters/opencode.test.ts \
            src/lib/ai/router.test.ts \
            src/lib/ai/router.connection.test.ts \
            src/lib/ai/router.smoke.test.ts \
            src/features/chat/runtime/__tests__/chatRuntimeCommandController.test.ts \
            src/features/chat/runtime/__tests__/runtimeModelControls.test.ts \
            src/features/chat/runtime/chatRuntimeSettingsStore.test.ts \
            src/features/chat/runtime/commandContracts.test.ts \
            src/features/chat/runtime/performanceProfile.test.ts \
            src/features/chat/runtime/rlmPreference.test.ts \
            src/features/chat/reasoningSlashStore.test.ts \
            src/features/context/rlm/__tests__/RlmCoordinator.test.ts \
            src/features/context/rlm/contextRlmProduction.test.ts \
            src/features/context/rlm/pointerAuthority.test.ts \
            src/features/context/rlm/routeDecision.test.ts \
            src/features/context/rlm/rlmOpenCodeTool.test.ts \
            src/lib/ai/catalog/canonicalModelCatalog.test.ts \
            src/lib/ai/catalog/modelVariants.test.ts \
            src/lib/harness/contracts.test.ts \
            src/lib/harness/__tests__/CredentialHydrationSnapshot.test.ts \
            src/lib/harness/__tests__/OpenCodeRequestControls.test.ts \
            src/lib/harness/__tests__/OpenCodeSdkSessionClient.test.ts \
            src/lib/harness/__tests__/OpenCodeSessionPool.test.ts \
            src/lib/harness/__tests__/OpenCodeTextAccumulator.test.ts \
            src/lib/harness/__tests__/OpenCodeTurnCoordinator.test.ts \
            src/lib/harness/__tests__/OpenCodeTurnGate.test.ts \
            src/lib/permissions/__tests__/OpenCodePermissionProfile.test.ts \
            src/lib/permissions/__tests__/RunScopedApprovalLease.test.ts \
            src/lib/mcp/builtins.test.ts \
            src/lib/mcp/registry.test.ts \
            src/lib/mcp/toolRouting.test.ts \
            src/lib/mcp/vibeSpaceGateway.test.ts \
            src/features/prompt-forge/modelSelection.test.ts \
            src/features/prompt-forge/promptForgeExecutor.test.ts \
            src/features/prompt-forge/preservation.test.ts \
            src/features/prompt-forge/sourcePack.test.ts \
            src/features/prompt-forge/contextPreparation.test.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/focused-results.json" > "$RUNNER_TEMP/focused-tests.log" 2>&1
          node - "$RUNNER_TEMP/focused-results.json" "$RUNNER_TEMP/focused-summary.txt" <<'NODE'
          const fs=require('node:fs'), r=JSON.parse(fs.readFileSync(process.argv[2],'utf8')), s=r.testResults??[];
          const tests=s.flatMap(x=>x.assertionResults??[]), failed=tests.filter(x=>x.status!=='passed').length;
          const out=`FOCUSED_FILES=${s.length}\nFOCUSED_TESTS=${tests.length}\nFOCUSED_FAILED=${failed}\n`;
          fs.writeFileSync(process.argv[3],out); process.stdout.write(out);
          if(s.length!==41||tests.length!==214||failed!==0) process.exit(1);
          NODE

      - name: Typecheck, wiring, build, and release manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
          node scripts/verify-pr31-opencode-rlm-integration.mjs 2>&1 | tee "$RUNNER_TEMP/production-wiring.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          npm run test:release-manifest 2>&1 | tee "$RUNNER_TEMP/release-manifest.log"

      - name: Final security and diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$STAGING_SHA"
          echo DIFF_CHECK=PASS > "$RUNNER_TEMP/diff-check.txt"
          python - "$BASE_SHA" "$STAGING_SHA" "$RUNNER_TEMP/secret-scan.txt" <<'PY'
          import pathlib,re,subprocess,sys
          base,head,out=sys.argv[1:]
          names=subprocess.check_output(['git','diff','--name-only',f'{base}...{head}'],text=True).splitlines()
          bad=[n for n in names if n.lower()=='.env' or n.lower().endswith(('.pem','.p12','.pfx','.key'))]
          diff=subprocess.check_output(['git','diff','-U0','--no-color',f'{base}...{head}'],text=True)
          added='\n'.join(x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          pats=[r'\bsk-[A-Za-z0-9_-]{20,}\b',r'\bAIza[A-Za-z0-9_-]{20,}\b',r'\b(?:ghp|gho|ghu|ghs|github_pat)_[A-Za-z0-9_]{20,}\b',r'\bAKIA[0-9A-Z]{16}\b',r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',r'\bBearer\s+[A-Za-z0-9._~+/=-]{32,}',r'\beyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\b']
          hits=[p for p in pats if re.search(p,added)]
          corpus='\n'.join(pathlib.Path(n).read_text(errors='ignore') for n in names if pathlib.Path(n).is_file()).lower()
          markers=['model_identity_mismatch','effort_unsupported','fast_mode_unsupported','pointer_invalid','last verified']
          missing=[m for m in markers if m not in corpus]
          if bad or hits or missing: print({'bad_paths':bad,'secret_hits':hits,'missing_markers':missing}); raise SystemExit(1)
          pathlib.Path(out).write_text('SECRET_SCAN=PASS\nNO_SILENT_FALLBACK_MARKERS=PASS\n')
          PY

      - uses: dtolnay/rust-toolchain@stable
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Rust static and focused native gates
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          { cargo fmt --check; cargo check --release; cargo test --lib cli_bridge_validates_timeout_output_and_request_id_bounds; } 2>&1 | tee "$RUNNER_TEMP/rust.log"

      - name: Normal no-force push and exact remote proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$STAGING_SHA"
          git log --format='%H %s' "$BASE_SHA..HEAD" | tee "$RUNNER_TEMP/integration-commits.txt"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git fetch --prune origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          local_head="$(git rev-parse HEAD)"; remote_head="$(git rev-parse "origin/${TARGET_BRANCH}")"
          printf 'LOCAL_FINAL_SHA=%s\nREMOTE_PR31_SHA=%s\nSHA_MATCH=%s\n' "$local_head" "$remote_head" "$([ "$local_head" = "$remote_head" ] && echo YES || echo NO)" | tee "$RUNNER_TEMP/sha-proof.txt"
          test "$local_head" = "$remote_head"
          git log -15 --oneline "origin/${TARGET_BRANCH}" > "$RUNNER_TEMP/remote-log.txt"
          git log --left-right --cherry-pick --oneline "origin/${TARGET_BRANCH}...HEAD" > "$RUNNER_TEMP/left-right.txt"
          test ! -s "$RUNNER_TEMP/left-right.txt"
          printf '%s\n' "$local_head" > "$RUNNER_TEMP/local-final-sha.txt"
          echo PUSH=PASS > "$RUNNER_TEMP/push.txt"

      - name: Verify PR31 remains open draft and unmerged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          python - "$(git rev-parse HEAD)" "$TARGET_BRANCH" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr-state.txt" <<'PY'
          import json,pathlib,sys
          sha,branch,src,out=sys.argv[1:]; pr=json.loads(pathlib.Path(src).read_text())
          checks={'PR_OPEN':pr.get('state')=='open','PR_DRAFT':pr.get('draft') is True,'PR_UNMERGED':pr.get('merged') is False,'HEAD_BRANCH':pr.get('head',{}).get('ref')==branch,'HEAD_SHA':pr.get('head',{}).get('sha')==sha}
          text=''.join(f'{k}={"PASS" if v else "FAIL"}\n' for k,v in checks.items()); pathlib.Path(out).write_text(text); print(text,end='')
          if not all(checks.values()): raise SystemExit(1)
          PY
          { cat "$RUNNER_TEMP/sha-proof.txt"; cat "$RUNNER_TEMP/push.txt"; cat "$RUNNER_TEMP/pr-state.txt"; cat "$RUNNER_TEMP/focused-summary.txt"; echo TYPECHECK=PASS; echo BUILD=PASS; echo RUST=PASS; cat "$RUNNER_TEMP/secret-scan.txt"; cat "$RUNNER_TEMP/diff-check.txt"; echo PRODUCTION_WIRING=PASS; cat "$RUNNER_TEMP/differential-summary.txt"; } > "$RUNNER_TEMP/final-status.txt"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31-opencode-rlm-differential-publication
          path: |
            ${{ runner.temp }}/guard.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/base-results.json
            ${{ runner.temp }}/staged-results.json
            ${{ runner.temp }}/base-summary.json
            ${{ runner.temp }}/staged-summary.json
            ${{ runner.temp }}/base-vitest.log
            ${{ runner.temp }}/staged-vitest.log
            ${{ runner.temp }}/BASE_FAILURES.txt
            ${{ runner.temp }}/STAGED_FAILURES.txt
            ${{ runner.temp }}/NEW_FAILURES.txt
            ${{ runner.temp }}/FIXED_FAILURES.txt
            ${{ runner.temp }}/differential-summary.txt
            ${{ runner.temp }}/focused-results.json
            ${{ runner.temp }}/focused-tests.log
            ${{ runner.temp }}/focused-summary.txt
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/production-wiring.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/release-manifest.log
            ${{ runner.temp }}/secret-scan.txt
            ${{ runner.temp }}/diff-check.txt
            ${{ runner.temp }}/rust.log
            ${{ runner.temp }}/integration-commits.txt
            ${{ runner.temp }}/local-final-sha.txt
            ${{ runner.temp }}/push.txt
            ${{ runner.temp }}/sha-proof.txt
            ${{ runner.temp }}/remote-log.txt
            ${{ runner.temp }}/left-right.txt
            ${{ runner.temp }}/pr.json
            ${{ runner.temp }}/pr-state.txt
            ${{ runner.temp }}/final-status.txt
          if-no-files-found: warn
          retention-days: 14
