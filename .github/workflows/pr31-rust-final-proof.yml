name: PR31 Rust differential and final proof

on:
  push:
    branches: [agent/pr31-opencode-rlm-verify-a6f1]
    paths: [.github/workflows/pr31-rust-final-proof.yml]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr31-rust-final-proof
  cancel-in-progress: false

env:
  BASE_SHA: 4209030eb041c661ee1a4b55e87367136638762b
  STAGING_SHA: e0c11422a5d038231cdfa73bf3f48dffc7554f51
  TARGET_BRANCH: agent/pr30-fixes-and-updates
  PR_NUMBER: '31'

jobs:
  rust-and-remote-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact published PR31 integration head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.STAGING_SHA }}
          fetch-depth: 0

      - name: Guard exact branch state and Rust scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "$local_head" = "$STAGING_SHA"
          test "$remote_head" = "$STAGING_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$STAGING_SHA"
          git diff --check "$BASE_SHA...$STAGING_SHA"
          git diff --name-only "$BASE_SHA...$STAGING_SHA" -- 'app/src-tauri/**/*.rs' | sort | tee "$RUNNER_TEMP/changed-rust-files.txt"
          test "$(cat "$RUNNER_TEMP/changed-rust-files.txt")" = 'app/src-tauri/src/cli_bridge.rs'
          git diff --quiet "$BASE_SHA...$STAGING_SHA" -- app/src-tauri/src/browser_chat_surface.rs
          printf 'LOCAL_AT_START=%s\nREMOTE_AT_START=%s\n' "$local_head" "$remote_head" > "$RUNNER_TEMP/guard.txt"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Prove repository-wide rustfmt failure is unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/pr31-rust-base"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"

          set +e
          (cd "$BASE_DIR/app/src-tauri" && cargo fmt --check) > "$RUNNER_TEMP/base-cargo-fmt.log" 2>&1
          base_status=$?
          (cd "$GITHUB_WORKSPACE/app/src-tauri" && cargo fmt --check) > "$RUNNER_TEMP/staged-cargo-fmt.log" 2>&1
          staged_status=$?
          set -e
          printf 'BASE_CARGO_FMT_EXIT=%s\nSTAGED_CARGO_FMT_EXIT=%s\n' "$base_status" "$staged_status" | tee "$RUNNER_TEMP/cargo-fmt-status.txt"

          python - "$BASE_DIR" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base-cargo-fmt.log" "$RUNNER_TEMP/staged-cargo-fmt.log" "$RUNNER_TEMP/base-cargo-fmt.normalized.log" "$RUNNER_TEMP/staged-cargo-fmt.normalized.log" <<'PY'
          from pathlib import Path
          import sys
          base_root, staged_root, base_in, staged_in, base_out, staged_out = sys.argv[1:]
          def normalize(src, root):
              text = Path(src).read_text(encoding='utf-8', errors='replace')
              return text.replace(root, '<ROOT>').replace('\\', '/')
          Path(base_out).write_text(normalize(base_in, base_root), encoding='utf-8')
          Path(staged_out).write_text(normalize(staged_in, staged_root), encoding='utf-8')
          PY

          test "$base_status" -ne 0
          test "$staged_status" -ne 0
          diff -u "$RUNNER_TEMP/base-cargo-fmt.normalized.log" "$RUNNER_TEMP/staged-cargo-fmt.normalized.log" | tee "$RUNNER_TEMP/cargo-fmt-differential.diff"
          grep -F 'browser_chat_surface.rs' "$RUNNER_TEMP/base-cargo-fmt.normalized.log"
          if grep -F 'cli_bridge.rs' "$RUNNER_TEMP/staged-cargo-fmt.normalized.log"; then
            echo 'Changed Rust file has a rustfmt violation.'
            exit 1
          fi
          echo 'CARGO_FMT_DIFFERENTIAL=PASS_ZERO_NEW' | tee "$RUNNER_TEMP/cargo-fmt-differential.txt"
          git worktree remove --force "$BASE_DIR"

      - name: Check formatting of the changed Rust file
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          rustfmt --edition 2021 --check src/cli_bridge.rs 2>&1 | tee "$RUNNER_TEMP/changed-rustfmt.log"
          echo 'CHANGED_RUSTFMT=PASS' | tee "$RUNNER_TEMP/changed-rustfmt-status.txt"

      - name: Cargo check release
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo check --release 2>&1 | tee "$RUNNER_TEMP/cargo-check.log"
          echo 'CARGO_CHECK_RELEASE=PASS' | tee "$RUNNER_TEMP/cargo-check-status.txt"

      - name: Focused native cli bridge test
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib cli_bridge_validates_timeout_output_and_request_id_bounds 2>&1 | tee "$RUNNER_TEMP/native-focused-test.log"
          echo 'NATIVE_FOCUSED_TEST=PASS' | tee "$RUNNER_TEMP/native-focused-test-status.txt"

      - name: Normal no-force push proof and SHA equality
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$STAGING_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" 2>&1 | tee "$RUNNER_TEMP/push.log"
          git fetch --prune origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse "origin/${TARGET_BRANCH}")"
          printf 'LOCAL_FINAL_SHA=%s\nREMOTE_PR31_SHA=%s\nSHA_MATCH=%s\n' \
            "$local_head" "$remote_head" "$([ "$local_head" = "$remote_head" ] && echo YES || echo NO)" | tee "$RUNNER_TEMP/sha-proof.txt"
          test "$local_head" = "$remote_head"
          git log -15 --oneline "origin/${TARGET_BRANCH}" | tee "$RUNNER_TEMP/remote-log.txt"
          git log --left-right --cherry-pick --oneline "origin/${TARGET_BRANCH}...HEAD" > "$RUNNER_TEMP/left-right.txt"
          test ! -s "$RUNNER_TEMP/left-right.txt"
          git log --format='%H %s' "$BASE_SHA..HEAD" | tee "$RUNNER_TEMP/integration-commits.txt"
          echo 'PUSH=PASS' | tee "$RUNNER_TEMP/push-status.txt"

      - name: Verify PR31 exact safety state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          python - "$(git rev-parse HEAD)" "$TARGET_BRANCH" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr-state.txt" <<'PY'
          import json
          from pathlib import Path
          import sys
          expected_sha, expected_branch, source, output = sys.argv[1:]
          pr = json.loads(Path(source).read_text(encoding='utf-8'))
          checks = {
              'PR_OPEN': pr.get('state') == 'open',
              'PR_DRAFT': pr.get('draft') is True,
              'PR_UNMERGED': pr.get('merged') is False,
              'HEAD_BRANCH': pr.get('head', {}).get('ref') == expected_branch,
              'HEAD_SHA': pr.get('head', {}).get('sha') == expected_sha,
          }
          text = ''.join(f'{key}={"PASS" if value else "FAIL"}\n' for key, value in checks.items())
          Path(output).write_text(text, encoding='utf-8')
          print(text, end='')
          if not all(checks.values()):
              raise SystemExit(1)
          PY

          {
            cat "$RUNNER_TEMP/sha-proof.txt"
            cat "$RUNNER_TEMP/push-status.txt"
            cat "$RUNNER_TEMP/pr-state.txt"
            cat "$RUNNER_TEMP/cargo-fmt-status.txt"
            cat "$RUNNER_TEMP/cargo-fmt-differential.txt"
            cat "$RUNNER_TEMP/changed-rustfmt-status.txt"
            cat "$RUNNER_TEMP/cargo-check-status.txt"
            cat "$RUNNER_TEMP/native-focused-test-status.txt"
            echo 'RUST_INTEGRATION_GATE=PASS'
          } | tee "$RUNNER_TEMP/final-rust-proof.txt"

      - name: Upload Rust and remote proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31-rust-and-remote-proof
          path: |
            ${{ runner.temp }}/guard.txt
            ${{ runner.temp }}/changed-rust-files.txt
            ${{ runner.temp }}/base-cargo-fmt.log
            ${{ runner.temp }}/staged-cargo-fmt.log
            ${{ runner.temp }}/base-cargo-fmt.normalized.log
            ${{ runner.temp }}/staged-cargo-fmt.normalized.log
            ${{ runner.temp }}/cargo-fmt-status.txt
            ${{ runner.temp }}/cargo-fmt-differential.diff
            ${{ runner.temp }}/cargo-fmt-differential.txt
            ${{ runner.temp }}/changed-rustfmt.log
            ${{ runner.temp }}/changed-rustfmt-status.txt
            ${{ runner.temp }}/cargo-check.log
            ${{ runner.temp }}/cargo-check-status.txt
            ${{ runner.temp }}/native-focused-test.log
            ${{ runner.temp }}/native-focused-test-status.txt
            ${{ runner.temp }}/push.log
            ${{ runner.temp }}/push-status.txt
            ${{ runner.temp }}/sha-proof.txt
            ${{ runner.temp }}/remote-log.txt
            ${{ runner.temp }}/left-right.txt
            ${{ runner.temp }}/integration-commits.txt
            ${{ runner.temp }}/pr.json
            ${{ runner.temp }}/pr-state.txt
            ${{ runner.temp }}/final-rust-proof.txt
          if-no-files-found: warn
          retention-days: 14
