<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON RUNNER — 3D Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; font-family: "Segoe UI", system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%; color: #e9ecff;
    pointer-events: none; z-index: 10;
    display: flex; justify-content: space-between; padding: 16px 22px;
    text-shadow: 0 0 8px rgba(80,200,255,.7);
  }
  .stat { display: flex; flex-direction: column; line-height: 1.15; }
  .stat .lbl { font-size: 11px; letter-spacing: .18em; opacity: .7; }
  .stat .val { font-size: 26px; font-weight: 700; }
  #score { color: #7dffa8; }
  #health .val { color: #ff9d7d; }
  #level .val { color: #9db8ff; }

  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; z-index: 20; text-align: center;
    background: radial-gradient(circle at 50% 35%, rgba(40,20,80,.55), rgba(5,6,15,.9));
    backdrop-filter: blur(3px); color: #eef1ff;
  }
  #overlay h1 { font-size: 54px; letter-spacing: .04em; font-weight: 800;
    background: linear-gradient(90deg,#7dffa8,#9db8ff,#ff9d7d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay p { opacity: .85; max-width: 560px; line-height: 1.6; }
  #overlay .keys { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  #overlay kbd { background: #141730; border: 1px solid #3a4166; border-bottom-width: 3px; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; color: #cfd6ff; }
  button {
    pointer-events: auto; margin-top: 8px; cursor: pointer;
    background: linear-gradient(180deg,#2b3566,#19203d); color: #eef1ff;
    border: 1px solid #3a4166; border-radius: 10px; padding: 13px 30px;
    font-size: 16px; font-weight: 700; letter-spacing: .04em;
  }
  button:hover { filter: brightness(1.2); }
  #overlay.hidden { display: none; }
  #finalScore { font-size: 22px; }
  #finalScore b { color: #7dffa8; font-size: 30px; }
  #err { position: fixed; bottom: 10px; left: 10px; z-index: 30; color: #ff6b6b; font-size: 12px; white-space: pre-wrap; max-width: 90vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="stat"><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
  <div class="stat"><span class="lbl">HEALTH</span><span class="val" id="health">100</span></div>
  <div class="stat"><span class="lbl">LEVEL</span><span class="val" id="level">1</span></div>
</div>

<div id="overlay">
  <h1>NEON RUNNER</h1>
  <p>Pilot the light-core through a shifting neon grid. Collect energy gems, dodge the red pulse barriers, and survive as the level escalates.</p>
  <div class="keys">
    <kbd>W A S D</kbd><kbd>Move</kbd>
    <kbd>SPACE</kbd><kbd>Jump</kbd>
    <kbd>SHIFT</kbd><kbd>Boost</kbd>
    <kbd>Mouse</kbd><kbd>Aim camera</kbd>
  </div>
  <p style="opacity:.6">Click below to start. Press Esc at any time to pause.</p>
  <button id="start">START RUN</button>
</div>

<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const errEl = document.getElementById('err');
const err = (m) => { errEl.textContent += m + '\n'; };
window.addEventListener('error', e => err(e.message));

// ---------- Renderer / Scene / Camera ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.022);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 400);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0x9db8ff, 0x05060f, 0.7));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(18, 30, 12);
dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
scene.add(dir);
const accent = new THREE.PointLight(0x7dffa8, 2, 60);
accent.position.set(0, 8, 0);
scene.add(accent);

// ---------- Grid ground ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.MeshStandardMaterial({ color: 0x0a0d1f, metalness: .4, roughness: .6 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(240, 60, 0x2a3a6e, 0x141a36);
scene.add(grid);

// Neon edge walls (visual bounds)
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a2350, emissive: 0x0f1533, metalness: .6, roughness: .4 });
const ARENA = 90; // half-size
function makeWall(w, d, x, z, ry=0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 2.4, d), wallMat);
  m.position.set(x, 1.2, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m);
}
makeWall(ARENA*2+4, 1, 0, -ARENA);
makeWall(ARENA*2+4, 1, 0,  ARENA);
makeWall(1, ARENA*2+4, -ARENA, 0);
makeWall(1, ARENA*2+4,  ARENA, 0);

// ---------- Player ----------
const player = new THREE.Group();
const bodyGeo = new THREE.IcosahedronGeometry(0.9, 1);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7dffa8, emissive: 0x0aff7d, emissiveIntensity: .8, metalness: .3, roughness: .3 });
const orb = new THREE.Mesh(bodyGeo, bodyMat);
orb.castShadow = true;
player.add(orb);
const trail = new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), new THREE.MeshBasicMaterial({color:0x7dffa8, transparent:true, opacity:.6}));
player.add(trail);
player.position.set(0, 2, 20);
scene.add(player);

// ---------- Game state ----------
const state = {
  running: false, paused: false, over: false,
  score: 0, health: 100, level: 1,
  velocity: new THREE.Vector3(),
  onGround: true,
  time: 0, spawnT: 0, obstacleT: 0,
  invuln: 0,
};
const keys = {};
const LEVEL_TIME = 20; // seconds per level
const MAX_HEALTH = 100;
const GRAVITY = -30;
const MOVE_SPEED = 16;
const BOOST_MULT = 1.7;
const JUMP_V = 12;

// ---------- Camera look (mouse) ----------
let yaw = Math.PI, pitch = 0;
let mouseDown = false;
document.addEventListener('mousemove', e => {
  if (!state.running || state.paused || !mouseDown) return;
  yaw -= e.movementX * 0.0026;
  pitch -= e.movementY * 0.0026;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
});
canvas.addEventListener('mousedown', () => mouseDown = true);
window.addEventListener('mouseup', () => mouseDown = false);

// ---------- Input ----------
const DOWN = (e, code) => { if (state.running) { keys[code] = true; } };
const UP = (e, code) => { keys[code] = false; };
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { if (state.running) togglePause(); return; }
  DOWN(e, e.code);
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => UP(e, e.code));

// ---------- Collectibles / obstacles ----------
const gems = [];
const obstacles = [];
const confetti = [];

function makeGem(pos) {
  const m = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.6, 0),
    new THREE.MeshStandardMaterial({ color: 0xffd34d, emissive: 0xffad1f, emissiveIntensity: 1, metalness: .5, roughness: .2 })
  );
  m.position.copy(pos); m.castShadow = true; scene.add(m); gems.push(m);
}
function spawnGem() {
  const x = (Math.random()*2-1) * (ARENA-8);
  const z = (Math.random()*2-1) * (ARENA-8);
  makeGem(new THREE.Vector3(x, 2 + Math.random()*4, z));
}
function makeObstacle(pos) {
  const color = 0xff4d6d;
  const geo = Math.random() < 0.5 ? new THREE.BoxGeometry(1.6,1.6,1.6) : new THREE.ConeGeometry(1,2.4,6);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, emissive: 0xff1f4d, emissiveIntensity: .9, metalness: .4, roughness: .4 }));
  m.position.copy(pos); m.castShadow = true; scene.add(m); obstacles.push(m);
}
function spawnObstacle() {
  const x = (Math.random()*2-1) * (ARENA-6);
  const z = (Math.random()*2-1) * (ARENA-6);
  if (Math.hypot(x - player.position.x, z - player.position.z) < 10) return;
  makeObstacle(new THREE.Vector3(x, 1.2, z));
}

// ---------- HUD ----------
const scoreEl = document.getElementById('score');
const healthEl = document.getElementById('health');
const levelEl = document.getElementById('level');
function updateHUD() {
  scoreEl.textContent = state.score;
  healthEl.textContent = Math.max(0, Math.round(state.health));
  levelEl.textContent = state.level;
}

// ---------- Audio (synth, no files) ----------
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function beep(freq, dur, type='sine', vol=.15, slideTo=null) {
  try {
    const ctx = audio(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
  } catch {}
}
const sfxCoin = () => beep(880, .18, 'triangle', .18, 1500);
const sfxHit = () => beep(160, .3, 'sawtooth', .2, 60);
const sfxJump = () => beep(300, .12, 'sine', .1, 500);
const sfxLevel = () => beep(520, .4, 'triangle', .15, 1040);

// ---------- Level / damage logic ----------
function bumpLevel() {
  state.level++;
  state.health = Math.min(MAX_HEALTH, state.health + 40);
  sfxLevel();
  updateHUD();
}
function damage() {
  if (state.invuln > 0) return;
  const d = 14 + state.level * 4;
  state.health -= d;
  state.invuln = 1.0;
  sfxHit();
  const dir = new THREE.Vector3().subVectors(player.position, camera.position).normalize();
  dir.y = 0.5;
  state.velocity.copy(dir.multiplyScalar(14));
  if (state.health <= 0) endGame(false);
  updateHUD();
}

// ---------- Particles ----------
function burst(pos, color=0x7dffa8, n=10) {
  for (let i=0;i<n;i++){
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.9}));
    p.position.copy(pos);
    p.userData.v = new THREE.Vector3((Math.random()*2-1)*8,(Math.random()*2-1)*8,(Math.random()*2-1)*8);
    scene.add(p); confetti.push(p);
  }
}

// ---------- Main loop ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;

  if (!state.running || state.paused || state.over) {
    renderer.render(scene, camera);
    return;
  }

  // Movement
  const boost = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = MOVE_SPEED * (boost ? BOOST_MULT : 1);
  const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
  const forward = new THREE.Vector3(-sinY, 0, -cosY);
  const right = new THREE.Vector3(cosY, 0, -sinY);
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (move.lengthSq()>0) move.normalize().multiplyScalar(speed);
  state.velocity.x = move.x;
  state.velocity.z = move.z;

  // Gravity / jump
  if (keys['Space'] && state.onGround) { state.velocity.y = JUMP_V; state.onGround = false; sfxJump(); }
  state.velocity.y += GRAVITY * dt;

  player.position.addScaledVector(state.velocity, dt);
  if (player.position.y <= 2) { player.position.y = 2; state.velocity.y = 0; state.onGround = true; }

  // Arena bounds
  player.position.x = Math.max(-ARENA+1, Math.min(ARENA-1, player.position.x));
  player.position.z = Math.max(-ARENA+1, Math.min(ARENA-1, player.position.z));

  // Camera follows behind
  const camDist = 10, camHeight = 5;
  const overhead = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  camera.position.copy(player.position).addScaledVector(overhead, camDist);
  camera.position.y = player.position.y + camHeight + pitch*4;
  camera.lookAt(player.position);

  // Gems
  for (let i=gems.length-1;i>=0;i--){
    const g = gems[i]; g.rotation.x += dt*2; g.rotation.y += dt*3; g.position.y += Math.sin(state.time*2 + i)*0.02;
    if (g.position.distanceTo(player.position) < 3) {
      scene.remove(g); gems.splice(i,1);
      state.score += 50 + state.level*10;
      updateHUD(); sfxCoin(); burst(g.position, 0xffd34d, 8);
    }
  }

  // Obstacles + invuln
  state.invuln = Math.max(0, state.invuln - dt);
  for (let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.rotation.y += dt * 1.5;
    o.position.y = 1.2 + Math.sin(state.time*3 + i)*0.3;
    if (o.position.distanceTo(player.position) < 2.4) damage();
  }

  // Confetti physics
  for (let i=confetti.length-1;i>=0;i--){
    const p = confetti[i];
    p.position.addScaledVector(p.userData.v, dt);
    p.userData.v.y -= 20*dt;
    p.material.opacity -= dt*2;
    if (p.material.opacity <= 0){ scene.remove(p); confetti.splice(i,1); }
  }

  // Spawning
  state.spawnT -= dt;
  if (state.spawnT <= 0){ spawnGem(); state.spawnT = Math.max(0.8, 2.6 - state.level*0.18); }
  state.obstacleT -= dt;
  if (state.obstacleT <= 0){
    const count = 1 + Math.floor(state.level/2);
    for(let k=0;k<count;k++) spawnObstacle();
    state.obstacleT = Math.max(0.9, 2.4 - state.level*0.2);
  }

  // Level progression
  if (state.time > state.level * LEVEL_TIME) bumpLevel();

  renderer.render(scene, camera);
}

// ---------- Flow ----------
const overlay = document.getElementById('overlay');
function togglePause() {
  if (!state.running || state.over) return;
  state.paused = !state.paused;
  overlay.classList.toggle('hidden', !state.paused);
  if (state.paused) overlay.querySelector('h1').textContent = 'PAUSED';
}
function resetGame() {
  state.score=0; state.health=MAX_HEALTH; state.level=1; state.time=0;
  state.spawnT=0; state.obstacleT=0; state.invuln=0; state.velocity.set(0,0,0);
  state.onGround=true; state.over=false; state.paused=false;
  while (gems.length){ scene.remove(gems.pop()); }
  while (obstacles.length){ scene.remove(obstacles.pop()); }
  player.position.set(0,2,20); player.rotation.set(0,0,0);
  yaw = Math.PI; pitch = 0;
  updateHUD();
}
function startGame(){
  resetGame();
  state.running = true;
  overlay.classList.add('hidden');
}
function endGame(win){
  state.over = true; state.running = false;
  overlay.querySelector('h1').textContent = win ? 'RUN COMPLETE' : 'GAME OVER';
  document.getElementById('finalScore').innerHTML = 'Score: <b>' + state.score + '</b> &nbsp; Level: <b>' + state.level + '</b>';
  overlay.querySelector('p').innerHTML = 'You survived at level ' + state.level + '. Gems are worth more at higher levels — jump the big one.';
  overlay.querySelector('button').textContent = 'PLAY AGAIN';
  overlay.classList.remove('hidden');
}
document.getElementById('start').addEventListener('click', () => {
  audio().resume();
  startGame();
});

// Initial scene preview (rendered behind overlay)
for (let i=0;i<6;i++){ spawnGem(); }
tick();

// Test/debug hook (harmless): lets automation verify collection + damage logic
window.__NEON__ = { player, gems, obstacles, state, makeGem, spawnGem, damage, resetGame, startGame };

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
