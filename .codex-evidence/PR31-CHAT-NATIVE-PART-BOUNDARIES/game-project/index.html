<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VIBE RUNNER — 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; font-family: "Segoe UI", system-ui, sans-serif; }
    #game { position: fixed; inset: 0; display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      color: #eaf2ff; user-select: none;
    }
    #score {
      position: absolute; top: 18px; left: 24px; font-size: 30px; font-weight: 700;
      letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,.7);
    }
    #score small { display:block; font-size: 12px; font-weight: 400; letter-spacing: 2px; color: #8fb4ff; }
    #best { position: absolute; top: 94px; left: 24px; font-size: 14px; color: #9fb6ff; opacity:.85; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
    #hpwrap {
      position: absolute; top: 20px; right: 24px; width: 200px; text-align: right;
    }
    #hplabel { font-size: 11px; letter-spacing: 2px; color: #9fb6ff; margin-bottom: 6px; }
    #hpbar {
      height: 12px; width: 100%; border-radius: 8px; overflow: hidden;
      background: rgba(0,0,0,.45); border: 1px solid rgba(160,180,255,.35); box-shadow: 0 0 12px rgba(0,0,0,.5) inset;
    }
    #hpfill { height: 100%; width: 100%; background: linear-gradient(90deg,#39ffb0,#28c9ff); transition: width .25s ease, background .25s ease; }
    #controls {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #cdddff; opacity: .8; text-align: center; letter-spacing: .5px;
      text-shadow: 0 1px 6px rgba(0,0,0,.7);
    }
    #msg {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
      font-size: 46px; font-weight: 800; color: #fff; letter-spacing: 3px;
      text-shadow: 0 4px 28px rgba(90,150,255,.8); opacity: 0; transition: opacity .5s ease; text-align:center;
    }
    #msg.show { opacity: 1; }
    #overlay {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; text-align: center;
      background: radial-gradient(circle at 50% 40%, rgba(30,45,90,.85), rgba(4,6,16,.96));
      color: #eaf2ff; transition: opacity .6s ease;
    }
    #overlay.hide { opacity: 0; pointer-events: none; }
    #overlay h1 { font-size: 58px; font-weight: 800; letter-spacing: 6px; background: linear-gradient(90deg,#39ffb0,#28c9ff,#9b7bff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #overlay p { font-size: 16px; color: #b9ccff; max-width: 520px; line-height: 1.6; }
    #overlay .keys { display:flex; gap: 14px; flex-wrap: wrap; justify-content:center; margin: 6px 0 4px; }
    .key { padding: 8px 14px; border: 1px solid rgba(160,180,255,.4); border-radius: 10px; background: rgba(255,255,255,.05); font-size: 13px; }
    #btnstart {
      pointer-events: auto; cursor: pointer; margin-top: 24px; padding: 16px 44px; font-size: 18px; letter-spacing: 2px;
      font-weight: 700; border: none; border-radius: 14px; color: #08111f;
      background: linear-gradient(90deg,#39ffb0,#28c9ff); box-shadow: 0 8px 30px rgba(40,201,255,.45);
      transition: transform .12s ease, box-shadow .12s ease; text-transform: uppercase;
    }
    #btnstart:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 38px rgba(40,201,255,.6); }
    #btnstart:active { transform: translateY(1px) scale(.99); }
    #final { font-size: 22px; color: #ffe08a; font-weight: 700; letter-spacing: 1px; }
    .hidden { display: none !important; }
    #vignette { position: fixed; inset: 0; pointer-events:none; z-index: 5; box-shadow: inset 0 0 180px 40px rgba(0,0,0,.55); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div id="score">0<small>SCORE</small></div>
    <div id="best">BEST: 0</div>
    <div id="hpwrap">
      <div id="hplabel">ENERGY</div>
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>
    <div id="msg" class=""></div>
    <div id="controls">W A S D — MOVE &nbsp;&bull;&nbsp; SPACE — DASH &nbsp;&bull;&nbsp; MOUSE — LOOK</div>
  </div>

  <div id="overlay">
    <h1>VIBE RUNNER</h1>
    <div class="keys">
      <div class="key">W A S D — Move</div>
      <div class="key">SPACE — Dash</div>
      <div class="key">MOUSE — Look</div>
    </div>
    <p id="overlaydesc">Roll across a floating sky world. Collect the glowing crystals for points, keep your energy alive, and dodge the rotating hazards. How long can you last?</p>
    <div id="final"></div>
    <button id="btnstart">PLAY</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
