<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON DASH — 3D Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; font-family: 'Segoe UI', system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #e8f0ff; padding: 20px 24px;
    text-shadow: 0 0 12px rgba(120,200,255,.6);
  }
  #stats { display: flex; justify-content: space-between; font-size: 15px; letter-spacing: 1px; opacity: .9; }
  .chip { background: rgba(20,30,60,.45); padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(120,180,255,.25); backdrop-filter: blur(6px); }
  .chip span { display: block; font-size: 10px; opacity: .6; letter-spacing: 2px; }
  .chip b { font-size: 22px; color: #9fe0ff; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,6,15,.72); backdrop-filter: blur(8px); color: #e8f0ff; text-align: center; z-index: 10; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 460px; padding: 30px 36px; }
  #overlay h1 { font-size: 42px; letter-spacing: 4px; margin-bottom: 8px; color: #fff; text-shadow: 0 0 24px #40c4ff; }
  #overlay h1 em { color: #ff5fa2; font-style: normal; }
  #overlay p { opacity: .8; line-height: 1.6; margin-bottom: 22px; }
  .keys { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 26px; }
  .key { background: rgba(30,40,80,.6); border: 1px solid rgba(120,180,255,.4); border-radius: 8px; padding: 8px 14px; font-size: 13px; }
  #btn {
    pointer-events: auto; cursor: pointer; font-size: 18px; letter-spacing: 2px; font-weight: 600;
    color: #071120; background: linear-gradient(135deg,#40c4ff,#7afcff); border: none; border-radius: 12px; padding: 14px 42px;
    box-shadow: 0 0 30px rgba(64,196,255,.6); transition: transform .12s, box-shadow .12s;
  }
  #btn:hover { transform: translateY(-2px); box-shadow: 0 0 44px rgba(122,252,255,.8); }
  #flash { position: fixed; inset: 0; pointer-events: none; }

  .note { position: fixed; left: 24px; bottom: 14px; font-size: 12px; opacity: .5; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="stats">
    <div class="chip"><span>SCORE</span><b id="score">0</b></div>
    <div class="chip"><span>BEST</span><b id="best">0</b></div>
    <div class="chip"><span>SPEED</span><b id="speed">1.0x</b></div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h1>NEON <em>DASH</em></h1>
    <p>Thread the glowing gates, dodge the obstacles and chase a high score in the endless neon canyon.</p>
    <div class="keys">
      <div class="key">Space / ↑ — Jump</div>
      <div class="key">← / → — Lane</div>
      <div class="key">ESC — Pause</div>
      <div class="key">R — Restart</div>
    </div>
    <button id="btn">START RUN</button>
  </div>
</div>

<canvas id="flash"></canvas>
<div class="note">Built with Three.js · NEON DASH</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- CONFIG ----------
const LANES = 3;
const LANE_W = 2.6;
const SPAWN_Z = -80;
const DESPAWN_Z = 8;
const FOG_COLOR = 0x05060f;

// ---------- RENDERER ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.Fog(FOG_COLOR, 30, 130);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 3.2, 9);

// ---------- LIGHTS ----------
scene.add(new THREE.AmbientLight(0x33406b, 1.1));
const hemi = new THREE.HemisphereLight(0x9fd4ff, 0x190a2a, 0.9);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(6, 14, 8);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -20; key.shadow.camera.right = 20;
key.shadow.camera.top = 20; key.shadow.camera.bottom = -20;
key.shadow.camera.far = 60;
scene.add(key);

const neonPurple = new THREE.PointLight(0xff5fa2, 2.4, 60);
neonPurple.position.set(-8, 5, -20); scene.add(neonPurple);
const neonBlue = new THREE.PointLight(0x40c4ff, 2.4, 60);
neonBlue.position.set(8, 5, -45); scene.add(neonBlue);

// ---------- MATERIALS ----------
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0f24, roughness: 0.9, metalness: 0.2 });
const railMatGray = new THREE.MeshStandardMaterial({ color: 0x1a2038, roughness: 0.5, metalness: 0.6 });
const gateMat = new THREE.MeshStandardMaterial({ color: 0x0c1228, emissive: 0x40c4ff, emissiveIntensity: 0.8, metalness: 0.3, roughness: 0.3 });
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x24101a, emissive: 0xff5fa2, emissiveIntensity: 0.6, roughness: 0.4, metalness: 0.5 });
const ornMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffb020, emissiveIntensity: 1.2, roughness: 0.2, metalness: 0.8 });
const playerMat = new THREE.MeshStandardMaterial({ color: 0x0ff0ff, emissive: 0x0fa8c0, emissiveIntensity: 0.9, roughness: 0.2, metalness: 0.8 });

// ---------- GROUND ----------
const groundGeo = new THREE.BoxGeometry(60, 1, 200);
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.set(0, -1.5, -60);
ground.receiveShadow = true;
scene.add(ground);

// Lane divider rails
const railGeo = new THREE.BoxGeometry(0.12, 0.12, 200);
for (let i = -1; i <= 1; i++) {
  const rail = new THREE.Mesh(railGeo, railMatGray);
  rail.position.set(i * LANE_W, 0, -60);
  rail.receiveShadow = true;
  scene.add(rail);
}

// glowing lane center lines
const lineMat = new THREE.MeshBasicMaterial({ color: 0x2a3f80 });
for (let i = -1; i <= 1; i++) {
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 200), lineMat);
  line.position.set(i * LANE_W, 0.01, -60);
  scene.add(line);
}

// Orbit rings far in the distance (decor)
const orbRingMat = new THREE.MeshBasicMaterial({ color: 0x21406b, wireframe: true });
for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(14 + i*4, 0.1, 8, 60), orbRingMat);
  ring.position.set(0, 6, -90 - i*18);
  ring.rotation.x = Math.PI / 2.2;
  scene.add(ring);
}

// ---------- PLAYER ----------
class Player {
  constructor() {
    this.group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.4), playerMat);
    body.castShadow = true;
    this.group.add(body);
    const eye = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    eye.position.set(0, 0.15, 0.7);
    this.group.add(eye);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0x00d0ff, emissive: 0x00a0c0, emissiveIntensity: 1, metalness: 0.6, roughness: 0.2 }));
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, 0, 1.1);
    this.group.add(nose);
    // engine glow
    this.glow = new THREE.PointLight(0x0ff0ff, 2, 8);
    this.glow.position.set(0, 0, -1.2);
    this.group.add(this.glow);
    scene.add(this.group);

    this.lane = 1;             // 0,1,2
    this.x = 0;
    this.y = 0;
    this.vy = 0;
    this.grounded = true;
    this.alive = true;
    this.group.position.set(this.x, this.y, 0);
  }
  setLane(l) {
    this.lane = Math.max(0, Math.min(LANES - 1, l));
  }
  jump() {
    if (this.grounded) {
      this.vy = 11;
      this.grounded = false;
    }
  }
  update(dt, g) {
    const targetX = (this.lane - 1) * LANE_W;
    this.x += (targetX - this.x) * Math.min(1, dt * 12);
    this.vy -= g * dt;
    this.y += this.vy * dt;
    if (this.y <= 0) { this.y = 0; this.vy = 0; this.grounded = true; }
    this.group.position.x = this.x;
    this.group.position.y = this.y;
    // tilt when turning
    const dx = targetX - this.x;
    this.group.rotation.z = -dx * 0.35;
  }
}

// ---------- OBSTACLES ----------
class Obstacle {
  constructor(z, lane) {
    this.group = new THREE.Group();
    const type = Math.random();
    if (type < 0.5) {
      // tall blocker
      const m = new THREE.Mesh(new THREE.BoxGeometry(LANE_W * 0.78, 4.2, 1.6), obstacleMat);
      m.position.y = 2.1;
      m.castShadow = true;
      this.group.add(m);
    } else {
      // low bar (jump over)
      const m = new THREE.Mesh(new THREE.BoxGeometry(LANE_W * 0.85, 1.0, 1.4), obstacleMat);
      m.position.y = 0.5;
      m.castShadow = true;
      this.group.add(m);
    }
    this.group.position.set((lane - 1) * LANE_W, 0, z);
    this.isLow = type >= 0.5;
    scene.add(this.group);
    this.dead = false;
    this.z = z;
  }
  update(speed, dt) {
    this.z += speed * dt;
    this.group.position.z = this.z;
  }
  dispose() {
    scene.remove(this.group);
    this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
}

// ---------- GATES (collectibles) ----------
class Gate {
  constructor(z, lane) {
    this.group = new THREE.Group();
    const arch = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.16, 8, 28, Math.PI), gateMat);
    arch.position.y = 0.2;
    this.group.add(arch);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), ornMat);
    this.group.add(orb);
    this.group.position.set((lane - 1) * LANE_W, 1.0, z);
    scene.add(this.group);
    this.z = z;
    this.dead = false;
  }
  update(speed, dt) {
    this.z += speed * dt;
    this.group.position.z = this.z;
    this.group.rotation.y += dt * 2;
  }
  dispose() {
    scene.remove(this.group);
    this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
}

// ---------- GAME STATE ----------
const player = new Player();
const obstacles = [];
const gates = [];
let score = 0;
let best = (() => { try { return parseInt(localStorage.getItem('neonDashBest') || '0', 10); } catch(e){ return 0; } })();
let baseSpeed = 0;
let speed = 0;
let running = false;
let paused = false;
let gameOver = false;
let lastZ = 0;
const GRAVITY = 28;

const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elSpeed = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const flash = document.getElementById('flash');

elBest.textContent = best;

function reset() {
  // clear pools
  while (obstacles.length) obstacles.pop().dispose();
  while (gates.length) gates.pop().dispose();
  player.lane = 1;
  player.x = 0; player.y = 0; player.vy = 0; player.grounded = true; player.alive = true;
  baseSpeed = 16;
  speed = 0;
  score = 0;
  lastZ = 0;
  running = true; gameOver = false; paused = false;
  elScore.textContent = '0';
  overlay.classList.add('hidden');
}

function spawnRow(z) {
  // ensure at least one open lane
  let openLane = Math.floor(Math.random() * LANES);
  // obstacle on up to 1-2 lanes
  const ob = 1 + (Math.random() < 0.35 ? 1 : 0);
  const lanesUsed = new Set();
  for (let i = 0; i < LANES; i++) {
    if (i === openLane) continue;
    const place = Math.random() < 0.45 && lanesUsed.size + 1 <= ob;
    if (place) {
      obstacles.push(new Obstacle(z, i));
      lanesUsed.add(i);
    }
  }
  // gate on the open lane
  if (Math.random() < 0.55) {
    gates.push(new Gate(z - 2, openLane));
  }
}

function distanceFrom(gap) {
  return (gap || 26);
}

function triggerGameOver() {
  running = false;
  gameOver = true;
  flashScreen();
  if (score > best) {
    best = score;
    try { localStorage.setItem('neonDashBest', String(best)); } catch(e){}
  }
  elBest.textContent = best;
  overlay.querySelector('h1').innerHTML = 'WRECKED <em>:(</em>';
  overlay.querySelector('p').textContent = 'Final score ' + score + '. In one more run, sir.';
  document.getElementById('btn').textContent = 'RUN AGAIN';
  overlay.classList.remove('hidden');
}

function flashScreen() {
  const f = flash.getContext('2d');
  flash.width = window.innerWidth; flash.height = window.innerHeight;
  f.fillStyle = 'rgba(255,80,120,0.35)';
  f.fillRect(0,0,flash.width,flash.height);
  setTimeout(() => { f.clearRect(0,0,flash.width,flash.height); }, 60);
}

// ---------- INPUT ----------
const keyState = {};
const jumpReq = [];
let laneReq = 0; // -1 left, 1 right, 0 none

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') { e.preventDefault(); if (running && !paused) jumpReq.push(1); }
  if (k === 'ArrowLeft' || k === 'KeyA') { e.preventDefault(); laneReq = -1; }
  if (k === 'ArrowRight' || k === 'KeyD') { e.preventDefault(); laneReq = 1; }
  if (k === 'Escape') { if (running) togglePause(); }
  if (k === 'KeyR') { reset(); }
});
window.addEventListener('keyup', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') if (laneReq === -1) laneReq = 0;
  if (k === 'ArrowRight' || k === 'KeyD') if (laneReq === 1) laneReq = 0;
});

function togglePause() {
  paused = !paused;
  if (paused) {
    overlay.querySelector('h1').innerHTML = 'PAUSED';
    overlay.querySelector('p').textContent = 'Press ESC or START to resume.';
    document.getElementById('btn').textContent = 'RESUME';
    overlay.classList.remove('hidden');
  } else {
    overlay.classList.add('hidden');
  }
}

document.getElementById('btn').addEventListener('click', () => {
  if (paused) { togglePause(); return; }
  reset();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- MAIN LOOP ----------
let last = performance.now();
const clockAlpha = { t: 0 };

function animate(now) {
  requestAnimationFrame(animate);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  clockAlpha.t += dt;

  if (running && !paused && !gameOver) {
    // accelerate over time
    speed += dt * 1.4;
    baseSpeed = 16 + speed;
    lastZ -= baseSpeed * dt;
    score += baseSpeed * dt * 0.1;
    elScore.textContent = Math.floor(score);
    elSpeed.textContent = (baseSpeed / 16).toFixed(1) + 'x';

    // input
    if (laneReq !== 0) { player.setLane(player.lane + laneReq); laneReq = 0; }
    if (jumpReq.length) { player.jump(); jumpReq.length = 0; }

    player.update(dt, GRAVITY);

    // spawn while moving through world
    while (lastZ > -SPAWN_Z) {
      lastZ -= distanceFrom(6 + Math.floor(Math.random()*8));
      spawnRow(lastZ);
    }

    // update obstacles / collision
    for (const o of obstacles) {
      o.update(baseSpeed, dt);
      // collision test
      const px = player.x, pz = 0;
      const ox = o.group.position.x, oz = o.group.position.z;
      const nearZ = Math.abs(oz - pz) < 1.6;
      const nearX = Math.abs(ox - px) < LANE_W * 0.62;
      if (nearZ && nearX) {
        const lowClear = o.isLow && player.y > 1.0;
        if (!lowClear) { player.alive = false; triggerGameOver(); }
      }
      if (oz > DESPAWN_Z) o.dead = true;
      if (o.dead) o.dispose();
    }
    for (let i = obstacles.length - 1; i >= 0; i--) if (obstacles[i].dead) obstacles.splice(i, 1);

    // gates
    for (const g of gates) {
      g.update(baseSpeed, dt);
      const gx = g.group.position.x, gz = g.group.position.z;
      if (Math.abs(gz - 0) < 1.4 && Math.abs(gx - player.x) < 1.3) {
        score += 100;
        elScore.textContent = Math.floor(score);
        g.dead = true;
      }
      if (gz > DESPAWN_Z) g.dead = true;
      if (g.dead) g.dispose();
    }
    for (let i = gates.length - 1; i >= 0; i--) if (gates[i].dead) gates.splice(i, 1);
  } else if (!running) {
    player.update(dt, GRAVITY);
  }

  // ----- effects -----
  // background orbits
  scene.children.forEach(c => { if (c.geometry && c.geometry.type === 'TorusGeometry') c.rotation.z += dt * 0.2; });
  neonBlue.intensity = 2.0 + Math.sin(clockAlpha.t * 3) * 0.6;
  neonPurple.intensity = 2.0 + Math.cos(clockAlpha.t * 3) * 0.6;
  // subtle camera bob
  camera.position.y = 3.2 + Math.sin(clockAlpha.t * 1.2) * 0.05;

  renderer.render(scene, camera);
}

// preview motion even before start
elSpeed.textContent = '1.0x';
requestAnimationFrame(animate);
</script>
</body>
</html>
